/* ================= TODAY ENGINE =================
   Regole: gambe ≥48 h prima di una partita; niente gambe nei giorni di padel;
   padel prima della palestra e una serie in meno sulle spinte sopra la testa;
   giorno di partita o energia bassa = una serie in meno su tutto; partita domani = RIR +1. */
function nextLegSlot(from){
  for(let i=1;i<=7;i++){const d=addDays(from,i),p=dayPlan(d),p1=dayPlan(addDays(d,1));
    if(p.padel==="none"&&p1.padel!=="match")return d}
  return null;
}
function assess(d){
  const p=dayPlan(d),t1=dayPlan(addDays(d,1)),t2=dayPlan(addDays(d,2)),energy=S.energy[iso(d)]||"ok";
  const r={level:"go",title:"",notes:[],mods:new Set(),gym:p.gym,padel:p.padel,energy};
  const say=(lvl,msg)=>{const order={go:0,adapt:1,stop:2};if(order[lvl]>order[r.level])r.level=lvl;r.notes.push(msg)};
  if(PLAN[p.gym]?.legs){
    if(p.padel!=="none"){
      const alt=nextLegSlot(d);
      say("stop",`Gambe e ${p.padel==="match"?"partita":"padel"} nello stesso giorno: le gambe ${alt?`spostale a ${WD_LONG[alt.getDay()]}`:"spostale a un giorno senza padel"}.`);
      if(PLAN.C){r.notes.push("Se vuoi comunque allenarti oggi, fai l'Upper C.");r.gymAlt="C"}
    }else if(t1.padel==="match"){
      const alt=nextLegSlot(addDays(d,1));
      say("stop",`Partita domani: niente gambe oggi. ${alt?`Spostale a ${WD_LONG[alt.getDay()]}.`:""}`);
      if(PLAN.C){r.notes.push("Oggi puoi fare l'Upper C o riposare.");r.gymAlt="C"}
    }else if(t2.padel==="match"){
      say("adapt","Partita dopodomani: gambe sì, ma senza Nordic e con una serie in meno sugli esercizi eccentrici pesanti (es. stacco rumeno).");r.mods.add("noEcc");
    }else if(t1.padel==="train"&&earlyPhase(d)){
      say("adapt","Domani padel, e sei nelle prime 3 settimane: una serie in meno sugli esercizi eccentrici pesanti (stacco rumeno, Nordic) per arrivare in campo meno indolenzito.");r.mods.add("noEccLight");
    }else if(t1.padel==="train"){
      say("go","Domani padel: seduta completa.");
    }else say("go","Giornata libera da padel e nessuna partita nelle prossime 48 h: seduta completa.");
  }else if(p.gym in PLAN){
    if(p.padel==="match"){say("adapt","Giorno di partita: palestra dopo la partita e solo se ti senti fresco. Una serie in meno su tutto.");r.mods.add("light")}
    else if(p.padel==="train"){
      const oh=PLAN[p.gym].ex.some(e=>e.oh),pv=PLAN[p.gym].ex.some(e=>e.t==="prev");
      if((S.order||"gym")==="gym"){say("adapt",`Palestra prima del padel: almeno 1 ripetizione in canna anche sull'isolamento${oh?", una serie in meno sulle spinte sopra la testa":""}${pv?". La prevenzione (cuffia, polso) falla dopo il padel":""}.`);r.mods.add("prePadel");if(oh)r.mods.add("oh")}
      else{say(oh?"adapt":"go",`Padel prima, palestra dopo${oh?". Una serie in meno sulle spinte sopra la testa":""}.`);if(oh)r.mods.add("oh")}
    }else say("go","Niente padel oggi: seduta completa.");
    if(t1.padel==="match"&&t2.padel==="match"&&p.padel==="none"){say("adapt","Partite domani e dopodomani: oggi solo braccia, Copenhagen, cuffia e polso. Petto, dorso e spalle li salti, così arrivi alle partite con le spalle fresche.");r.mods.add("prevOnly");r.notes=r.notes.filter(n=>!/seduta completa/.test(n))}
    else if(t1.padel==="match"){say("adapt","Partita domani: tieni 1 ripetizione in più in canna su tutto.");r.mods.add("rir")}
  }else{
    if(p.padel==="match")r.notes.push("Giorno di partita. Carboidrati 2-3 h prima, acqua con sali durante, proteine + carboidrati entro 2 h dopo.");
    else if(p.padel==="train")r.notes.push("Solo padel oggi. Se ti avanza tempo: 10 minuti di extrarotazioni e polso.");
    else r.notes.push("Riposo. Dormi, mangia, e se vuoi 10 minuti di mobilità per anche e spalle.");
  }
  if(energy==="low"&&p.gym in PLAN&&!(PLAN[p.gym].legs&&r.level==="stop")){say("adapt","Energia bassa: stessi carichi, una serie in meno per esercizio.");r.mods.add("light")}
  if(deloadOn(d)&&p.gym in PLAN){say("adapt",`Settimana di scarico fino a ${fmtShort(S.deload.to)}: metà serie, stessi carichi, 3-4 ripetizioni in canna.`);r.mods.add("deload")}
  r.title={go:"Via libera",adapt:"Seduta adattata",stop:"Cambia programma"}[r.level];
  if(!(p.gym in PLAN))r.title=p.padel==="match"?"Giorno di partita":p.padel==="train"?"Giorno di padel":"Giorno di riposo";
  return r;
}
function setsFor(ex,mods){
  if(mods.has("prevOnly")&&ex.t!=="prev"&&!ex.keep)return 0;
  if(mods.has("noEcc")&&ex.t==="nordic")return 0;
  if(mods.has("deload"))return Math.max(1,Math.ceil((+ex.s||1)/2));
  let s=+ex.s||1;
  if(mods.has("light"))s-=1;
  if(mods.has("oh")&&ex.oh)s-=1;
  if((mods.has("noEccLight")||mods.has("noEcc"))&&ex.ecc)s-=1;
  return Math.max(1,s);
}

/* ================= PROGRESSION ENGINE =================
   Doppia progressione: prima le ripetizioni dentro il range (+1 per serie), poi il carico.
   Gradino dall'attrezzo (macchina/cavo 5, bilanciere/Smith 2,5, manubri/zavorra 2). Multiarticolari: almeno +2,5% parte alta, +5% gambe.
   Sforzo dell'ultima serie: facile = aumento doppio o +2 rip; al limite su multiarticolare a fine range = carico fermo.
   Isolamento con gradino >15% del carico: range esteso fino a +5 rip prima del salto.
   Due sedute di fila sotto il minimo del range = -10% e si riparte dal basso. Sedute di scarico escluse.
   Pliometria: reps fisse, si progredisce in qualità (altezza/distanza), mai in volume. */
function history(exId){return S.sessions.filter(s=>s.sets&&s.sets[exId]&&s.sets[exId].some(x=>num(x.reps)!=null)).sort((a,b)=>b.date.localeCompare(a.date))}
const roundStep=(x,st)=>Math.round(x/st)*st;
function target(ex){
  const h=history(ex.id).filter(x=>!x.deload),last=h[0];
  const rr=(ex.lo===ex.hi?ex.lo:ex.lo+"-"+ex.hi),lr=/\d/.test(ex.rir||"")?" lasciando "+ex.rir+" in canna":"";
  const base={kg:null,reps:Array(ex.s).fill(ex.lo),badge:"",kind:"flat",msg:ex.t==="time"?`Prima volta: tieni ${ex.lo} s${ex.side?" per lato":""}, senza arrivare allo sfinimento.`:ex.t==="nordic"?`Prima volta: scegli l'elastico con cui fai ${rr} ripetizioni frenando fino in fondo.`:ex.t==="bw"?`Prima volta: a corpo libero, ${rr} ripetizioni${lr}. Se ne fai di più, aggiungi zavorra.`:`Prima volta: scegli un carico con cui arrivi a ${rr} ripetizioni${lr}.`};
  if(ex.t==="perf")return {...base,msg:last?"Stesse ripetizioni. Se gli atterraggi sono stati puliti, alza il box o allunga il salto.":"Ripetizioni fisse: conta la qualità di ogni salto."};
  if(!last)return base;
  const eff=(last.eff||{})[ex.id];
  const sets=last.sets[ex.id].filter(x=>num(x.reps)!=null);
  const reps=sets.map(x=>num(x.reps));
  const kgs=sets.map(x=>num(x.kg)).filter(v=>v!=null);
  const kg=kgs.length?Math.max(...kgs):null;
  // Range chiuso = tutte le serie previste quel giorno (anche se ridotte da padel, energia o partita) al carico più alto
  let lm=last.mods;if(!lm){try{lm=[...assess(new Date(last.date)).mods]}catch(e){lm=null}}
  const planned=Math.max(1,lm?setsFor(ex,new Set(lm)):ex.s);
  const heavy=kg!=null?sets.filter(x=>num(x.kg)===kg):sets,hReps=heavy.map(x=>num(x.reps));
  const full=heavy.length>=planned;
  const st=ex.step||2.5;
  // Isolamento e prevenzione con un gradino grosso rispetto al carico (>15%, es. extrarotazione 5 → 10 kg): prima si va oltre il range con le ripetizioni
  const big=(ex.t==="iso"||ex.t==="prev")&&kg>0&&st/kg>0.15;
  const top=big?Math.min(30,ex.hi+5):ex.hi;
  const allTop=full&&hReps.every(r=>r>=top);
  const allIn=reps.every(r=>r>=ex.lo);
  const prev=h[1]?h[1].sets[ex.id].filter(x=>num(x.reps)!=null).map(x=>num(x.reps)):null;
  const missTwice=!allIn&&prev&&prev.some(r=>r<ex.lo);
  if(ex.t==="time"){
    if(allTop)return {kg:null,reps:Array(ex.s).fill(ex.lo),kind:"up",badge:"Livello +",msg:`Hai tenuto ${ex.hi} s su tutte: passa alla versione più dura (gamba tesa) e riparti da ${ex.lo} s.`};
    const nr=reps.map(r=>Math.min(ex.hi,Math.max(ex.lo,r+5)));
    return {kg:null,reps:pad(nr,ex.s),kind:"up",badge:"+5 s",msg:"Aggiungi 5 secondi per serie."};
  }
  if(ex.t==="nordic"){
    if(allTop)return {kg:null,reps:Array(ex.s).fill(ex.lo),kind:"up",badge:"Meno aiuto",msg:`Chiuse tutte a ${ex.hi}: usa un elastico più leggero e riparti da ${ex.lo}.`};
    return {kg:null,reps:pad(reps.map(r=>Math.min(ex.hi,Math.max(ex.lo,r+1))),ex.s),kind:"up",badge:"+1 rip",msg:"Una ripetizione in più per serie, stesso elastico."};
  }
  if(allTop){
    if(eff==="hard"&&ex.t==="comp")return {kg,reps:Array(ex.s).fill(ex.hi),top,kind:"flat",badge:"=",msg:`Range chiuso ma al limite: stesso carico e stesse ripetizioni. Aumenti quando ti restano ${ex.rir} in canna.`};
    let inc=st;
    if(ex.t==="comp"&&kg)inc=Math.max(st,roundStep(kg*(ex.lower?0.05:0.025),st));
    const easy=eff==="easy"&&(ex.t==="comp"||ex.t==="bw")&&(!kg||(inc+st)/kg<=0.1);
    if(easy)inc+=st;
    if(ex.t==="bw"&&kg==null)return {kg:inc,reps:Array(ex.s).fill(ex.lo),top,kind:"up",badge:"Zavorra",msg:`Chiuse tutte a ${ex.hi}: aggiungi ${fk(inc)} kg di zavorra e riparti da ${ex.lo}.`};
    const nk=(kg||0)+inc;
    return {kg:nk,reps:Array(ex.s).fill(ex.lo),top,kind:"up",badge:`+${fk(inc)} kg`,msg:easy?`Range chiuso ed era facile: doppio aumento, ${fk(nk)} kg, riparti da ${ex.lo} ripetizioni.`:big?`Arrivato a ${top} ripetizioni: passa a ${fk(nk)} kg e riparti da ${ex.lo}.`:`Tutte le serie al limite alto: ${fk(nk)} kg e riparti da ${ex.lo} ripetizioni.`};
  }
  const sm=a=>a.reduce((t,r)=>t+r,0);
  if(missTwice&&kg&&!(prev&&sm(reps)>sm(prev))){
    let nk=Math.max(st,roundStep(kg*0.9,st));if(nk>=kg&&kg-st>0)nk=kg-st;
    if((kg-nk)/kg>0.15)return {kg,reps:pad(reps.map(r=>Math.min(top,r+1)),ex.s,ex.lo),top,kind:"up",badge:"+1 rip",msg:`Stesso carico: scendere di un gradino sarebbe troppo. Una ripetizione in più per serie, finché arrivi a ${ex.lo}.`};
    return {kg:nk,reps:Array(ex.s).fill(ex.lo),top,kind:"down",badge:nk<kg?`-${fk(kg-nk)} kg`:"=",msg:`Due sedute sotto le ${ex.lo} ripetizioni: scendi a ${fk(nk)} kg e ricostruisci.`};
  }
  if(!allIn)return {kg,reps:Array(ex.s).fill(ex.lo),top,kind:"flat",badge:"=",msg:`Stesso carico, obiettivo ${ex.lo} ripetizioni su tutte le serie.`};
  const add=eff==="easy"?2:1;
  const nr=pad(reps.map(r=>Math.min(top,r+add)),ex.s,ex.lo);
  const over=big&&reps.every(r=>r>=ex.hi);
  return {kg,reps:nr,top,kind:"up",badge:`+${add} rip`,msg:over?`Il prossimo peso è un salto del ${Math.round(st/kg*100)}%: prima porta tutte le serie a ${top} ripetizioni.`:add===2?"Era facile: stesso carico, due ripetizioni in più per serie.":"Stesso carico, una ripetizione in più per serie."};
}
function lastKg(ex){const l=history(ex.id).filter(x=>!x.deload)[0];if(!l)return null;const k=l.sets[ex.id].map(x=>num(x.kg)).filter(v=>v!=null);return k.length?Math.max(...k):null}
function tgFor(ex,mods){const t=target(ex);if(!mods.has("deload")||["perf","time","nordic"].includes(ex.t))return t;const k=lastKg(ex);return {...t,kg:k,reps:Array(ex.s).fill(ex.lo),kind:"flat",badge:"Scarico",msg:`Stesso carico dell'ultima volta, ${ex.lo} ripetizioni, 3-4 in canna.`}}
/* Fase: massa (predefinita), definizione, mantenimento. Cambia fascia di peso, avviso "Fermo" e analisi */
const PH={massa:{n:"Massa",lo:.25,hi:.5,src:"Iraki 2019",col:""},def:{n:"Definizione",lo:-1,hi:-.5,src:"Helms 2014, Garthe 2011",col:"var(--adapt)"},mant:{n:"Mantenimento",lo:-.25,hi:.25,src:"regola pratica",col:"var(--muted)"}};
function phaseAt(d){const k=typeof d==="string"?d:iso(d||today());let ph="massa";for(const x of (S.phases||[]).slice().sort((a,b)=>a.d.localeCompare(b.d)))if(x.d<=k)ph=x.ph;return ph}
// Prime 3 settimane della fase (o dalla prima seduta): il taglio sugli eccentrici prima del padel vale solo qui, poi le gambe sono abituate
function earlyPhase(d){const st=phaseStart()||(S.sessions.map(x=>iso(x.date)).sort()[0]);return !st||(d-new Date(st+"T00:00:00"))<21*864e5}
function phaseStart(){const P=(S.phases||[]).slice().sort((a,b)=>a.d.localeCompare(b.d)),cur=phaseAt();let st=null;for(const x of P){if(x.d>iso(today()))break;if(x.ph===cur){if(!st)st=x.d}else st=null}return st}
function setPhase(ph){S.phases=(S.phases||[]).filter(x=>x.d!==iso(today()));if(phaseAt()!==ph||!S.phases.length)S.phases.push({d:iso(today()),ph});save()}
function phaseBands(x0,x1){const P=(S.phases||[]).slice().sort((a,b)=>a.d.localeCompare(b.d)),out=[];
  P.forEach((p,i)=>{if(!PH[p.ph].col)return;const a=new Date(p.d+"T00:00:00"),b=P[i+1]?new Date(P[i+1].d+"T00:00:00"):new Date(8.6e15);const s0=Math.max(+a,+x0),s1=Math.min(+b,+x1);if(s1>s0)out.push({a:s0,b:s1,ph:p.ph})});return out}
// Fermo (revisione del ciclo): in massa l'ultima seduta non supera quella di 3 sedute prima; in definizione il massimale cala oltre il 5% in 2 sedute
function stallBy(ph,v){if(v.length<4)return false;if(ph==="def"){const ref=Math.max(v[2],v[3]);return v[0]<ref*.95&&v[1]<ref*.95}return v[0]<=v[3]}
function stalled(ex){if(["perf","time","nordic"].includes(ex.t))return false;const h=history(ex.id).filter(x=>!x.deload);if(h.length<4)return false;const ph=phaseAt();
  if(ph==="def"){const m=s=>Math.max(0,...s.sets[ex.id].map(x=>metricOf(ex,x)));return stallBy(ph,h.slice(0,4).map(m))}
  // Massa e mantenimento: fermo solo se in 3 sedute non sono saliti né i kg massimi né il massimale stimato della serie migliore
  // (salire di carico perdendo qualche ripetizione non è uno stallo; il numero di serie non conta)
  const kg=s=>Math.max(0,...s.sets[ex.id].map(x=>num(x.kg)||0)),bm=s=>Math.max(0,...s.sets[ex.id].map(x=>metricOf(ex,x)));
  return !(kg(h[0])>kg(h[3]))&&!(bm(h[0])>bm(h[3])+1e-9)}
const deloadOn=(d=today())=>!!S.deload&&iso(d)>=S.deload.from&&iso(d)<=S.deload.to;
function deloadAdvice(){
  if(S.deload||!S.sessions.length)return null;if(S.deloadSnooze&&iso(today())<S.deloadSnooze)return null;
  const why=[],cut=iso(addDays(today(),-21));
  const ids=[...new Set(S.sessions.filter(x=>x.date.slice(0,10)>=cut).flatMap(x=>Object.keys(x.sets||{})))];
  const st=ids.filter(id=>stalled(exById(id))).length;if(st>=3)why.push(`${st} esercizi fermi da 3 sedute`);
  const since=S.lastDeload||S.sessions.map(x=>x.date.slice(0,10)).sort()[0];const wk=Math.floor((today()-new Date(since))/(7*864e5));

}

const e1rm=(kg,r)=>kg*(1+r/30);
function bestMetric(exId,excludeId){
  const ex=EX[exId];let best=0;
  for(const s of S.sessions){if(s.id===excludeId)continue;for(const x of (s.sets[exId]||[])){const v=metricOf(ex,x);if(v>best)best=v}}
  return best;
}
function metricOf(ex,x){const r=num(x.reps),k=num(x.kg);if(r==null)return 0;if(k&&k>0&&ex.t!=="time"&&ex.t!=="perf"&&ex.t!=="nordic")return e1rm(k,r);return r}

function liftTrend(from,to){// variazione media del massimale stimato sui multiarticolari tra due finestre di 14 giorni
  const ids=new Set();ALL_EX.filter(e=>e.t==="comp").forEach(e=>ids.add(e.id));const ch=[];
  for(const id of ids){const ex=exById(id);const best=(a,b)=>Math.max(0,...S.sessions.filter(s=>{const d=new Date(s.date);return !s.deload&&d>=a&&d<b&&s.sets[id]}).flatMap(s=>s.sets[id].map(x=>metricOf(ex,x))));
    const o=best(addDays(from,-14),from),n=best(addDays(to,-14),addDays(to,1));if(o>0&&n>0)ch.push((n-o)/o)}
  return ch.length>=2?ch.reduce((a,b)=>a+b,0)/ch.length:null}
function bodyCard(){const W=S.body.filter(x=>x.kg!=null).sort((a,b)=>a.d.localeCompare(b.d));const L=W[W.length-1];
  const M=S.body.filter(x=>x.arm!=null||x.chest!=null||x.waist!=null).sort((a,b)=>a.d.localeCompare(b.d));
  let trend="",calo="";
  if(W.length>=2){const ref=W.slice().reverse().find(x=>daysAgo(x.d)>=28)||W[0],dd=daysAgo(ref.d)-daysAgo(L.d),dk=L.kg-ref.kg;
    const sg=phaseAt()==="def"?-dk:phaseAt()==="mant"?-Math.abs(dk):dk;trend=`<span class="pill ${sg>0.1?"go":sg<-0.1?"stop":""}">${dk>=0?"+":""}${fk(Math.round(dk*10)/10)} kg in ${Math.max(1,Math.round(dd/7))} sett.</span>`;
    if(dd>=14){const pct=dk/ref.kg*100/(dd/7);calo+=`<p class="note" style="margin:6px 0 0">${fk(Math.round(pct*100)/100)}% a settimana. ${bandTxt(phaseAt(),pct)}</p>`}
    if(phaseAt()==="massa"&&dd>=28&&dk<=0.25){const lt=liftTrend(new Date(ref.d+"T00:00:00"),new Date(L.d+"T00:00:00"));if(lt!=null&&lt>0.02)calo+=`<p class="prog down"><span>Carichi su del ${fk(Math.round(lt*100))}% in ${Math.round(dd/7)} settimane, peso fermo: per mettere massa adesso il limite sono le calorie.</span></p>`}}
  const mk=(f,l)=>{const a=M.filter(x=>x[f]!=null);if(!a.length)return"";const z=a[a.length-1],p=a[a.length-2];return `<div class="tile"><b>${fk(z[f])}</b><span>${l}${p?` · ${z[f]-p[f]>=0?"+":""}${fk(Math.round((z[f]-p[f])*10)/10)}`:""}</span></div>`};
  const tiles=[mk("arm","Braccio cm"),mk("chest","Petto cm"),mk("waist","Vita cm")].join("");

    ${W.length>=2?`<div class="chart" id="bodyChart"></div>`:""}${calo}${tiles?`<div class="tiles">${tiles}</div>`:""}</section>`}

function sessStats(s){let n=0,vol=0;for(const id in s.sets){const e=exById(id);for(const x of s.sets[id]){n++;const k=num(x.kg),r=num(x.reps);if(k&&r&&e.t!=="time")vol+=k*r}}return {n,vol}}
const bestIn=(s,id)=>{const e=exById(id);return Math.max(0,...(s.sets[id]||[]).map(x=>metricOf(e,x)))};
// Riepilogo: cosa chiede la prossima seduta, esercizio per esercizio (carichi già calcolati dalla progressione)
function nextHTML(sess){if(sess.deload)return "";const out=[];
  for(const id in sess.sets){const e=exById(id);if(!e||!e.n)continue;let t;try{t=target(e)}catch(_){continue}if(!t)continue;
    const reps=[...new Set((t.reps||[]).map(String))],u=e.t==="time"?" s":" rip",now=Math.max(0,...sess.sets[id].map(x=>num(x.kg)||0));
    const up=t.kg>now+1e-9,txt=t.kg>0&&!["time","perf"].includes(e.t)?`${fk(t.kg)} kg × ${reps.join("/")}`:`${reps.join("/")}${u}`;
    out.push(`<li><span>${esc((sess.names&&sess.names[id])||e.n)}</span><em class="${up?"up":""}">${txt}</em></li>`)}
  return out.length?`<section class="sumr sumn"><b>La prossima volta</b><ul>${out.join("")}</ul></section>`:""}
function summarySheet(sess){
  const st=sessStats(sess),others=S.sessions.filter(x=>x.id!==sess.id),ups=rankUps(sess);
  const prev=others.filter(x=>x.day===sess.day&&x.date<sess.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const recs=[];for(const id in sess.sets){const e=exById(id),now=bestIn(sess,id),pb=Math.max(0,...others.map(x=>bestIn(x,id)));
    if(pb>0&&now>pb+1e-9){const kg=sess.sets[id].some(x=>num(x.kg)>0)&&!["time","perf","nordic"].includes(e.t);recs.push(`<li><span>${esc((sess.names&&sess.names[id])||e.n)}</span><em>${fk(Math.round(now*10)/10)} ${kg?"kg":e.t==="time"?"s":"rip"}</em></li>`)}}
  let cmp="";
  if(prev){const ps=sessStats(prev),dv=ps.vol?Math.round((st.vol-ps.vol)/ps.vol*100):null;let up=0,com=0;
    for(const id in sess.sets)if(prev.sets[id]){com++;if(bestIn(sess,id)>bestIn(prev,id)+1e-9)up++}
    cmp=`<section class="sumc"><b>Rispetto a ${esc(fmtWd(prev.date))}</b>
      ${dv!=null?`<div><span>Volume</span><em class="${dv>0?"up":dv<0?"dn":""}">${dv>0?"+":""}${dv}%</em></div>`:""}
      <div><span>Serie</span><em>${ps.n} → ${st.n}</em></div>
      ${sess.dur&&prev.dur?`<div><span>Durata</span><em>${prev.dur} → ${sess.dur} min</em></div>`:""}
      ${com?`<div><span>Esercizi migliorati</span><em class="${up?"up":""}">${up} su ${com}</em></div>`:""}</section>`}
  openSheet({html:()=>`<h2>${esc(sess.planName||"Seduta")} salvata</h2>
    <div class="tiles"><div class="tile"><b>${sess.dur??"—"}</b><span>minuti</span></div><div class="tile"><b>${st.n}</b><span>serie</span></div><div class="tile"><b>${Math.round(st.vol).toLocaleString("it-IT")}</b><span>kg sollevati</span></div></div>
    ${rankPromoHTML(ups)}
    ${recs.length?`<section class="sumr"><b>Record (massimale stimato)</b><ul>${recs.join("")}</ul></section>`:""}
    ${cmp||`<p class="note" style="margin:0">Prima volta con questa seduta: il confronto parte dalla prossima.</p>`}
    ${nextHTML(sess)}
    <p class="note" style="margin:0">I carichi della prossima volta sono già pronti.</p>`,
   bind:w=>{const r=w.querySelector(".sumr:not(.sumn)");if(r)setTimeout(()=>blade(r),450)}})}

  lastPct[g]=pct;document.documentElement.style.setProperty("--p",(pct/100).toFixed(2));

function isRecord(g,ex,exId,j,r){if(noEff(ex)||!history(exId).length)return false;const v=metricOf(ex,r);if(!(v>0))return false;

 "bulgarian split squat":["Collo del piede dietro appoggiato su una panca, piede davanti un passo lungo avanti, manubri in mano.", "Scendi dritto finché il ginocchio dietro quasi tocca terra; risali spingendo col piede davanti."],
 "nordic curl":["In ginocchio su un cuscino, caviglie bloccate sotto un rullo o tenute da un compagno, corpo dritto.", "Inclinati in avanti a corpo dritto frenando con i femorali più a lungo possibile; prendi la caduta con le mani e torna su."],
 "copenhagen plank":["Di fianco su un avambraccio, gamba sopra appoggiata sulla panca (caviglia o ginocchio), gamba sotto libera.", "Solleva il bacino finché il corpo è dritto dalla testa ai piedi e tieni la posizione per i secondi indicati."],
 "calf in piedi":["Spalle sotto i cuscinetti, avampiedi sul bordo del gradino, gambe tese.", "Scendi coi talloni sotto il gradino e fermati 1 s, poi sali in punta più in alto possibile."],
 "woodchop al cavo":["Di fianco alla colonna, cavo alto, maniglia con due mani sopra la spalla vicina, piedi larghi.", "Tira in diagonale verso il fianco opposto ruotando anche e busto, braccia quasi tese; torna controllato."],
 "extrarotazione al cavo":["Di fianco al cavo regolato all'altezza del gomito, gomito a 90° attaccato al fianco, mano davanti alla pancia.", "Ruota l'avambraccio verso l'esterno tenendo il gomito fermo al fianco; torna lento."],
 "estensione del polso":["Seduto, avambraccio appoggiato sulla coscia, palmo verso il basso, mano oltre il ginocchio con un manubrio leggero.", "Alza il dorso della mano piegando solo il polso; scendi in 3 s."],
 "landmine press":["In ginocchio su una gamba o in piedi, estremità del bilanciere in una mano davanti alla spalla, l'altra estremità fissata a terra.", "Spingi in alto e in avanti fino al braccio teso; torna alla spalla controllando."],
 "lento manubri seduto":["Seduto con lo schienale quasi verticale, manubri all'altezza delle spalle, gomiti un po' in avanti.", "Spingi in alto fino a braccia quasi tese; scendi finché i manubri arrivano all'altezza delle orecchie."],
 "lat machine presa neutra":["Seduto, cosce bloccate sotto i rulli, maniglia stretta con i palmi uno verso l'altro, braccia tese.", "Abbassa le scapole e tira la maniglia al petto alto con i gomiti verso i fianchi; risali lento a braccia tese."],
 "croci ai cavi dal basso":["In piedi tra due cavi bassi, una maniglia per mano, braccia in basso e aperte, gomiti appena piegati.", "Porta le mani in alto e davanti fino all'altezza del petto alto, gomiti fermi; torna lento."],
 "pulley basso":["Seduto, piedi sulla pedana, ginocchia appena piegate, busto dritto, braccia tese in avanti.", "Tira la maniglia all'ombelico portando i gomiti indietro e stringendo le scapole; torna allungando le braccia senza piegarti."],
 "face pull":["Cavo all'altezza degli occhi, corda presa dall'alto, un passo indietro, braccia tese in avanti.", "Tira la corda verso gli occhi aprendo le mani ai lati della testa, gomiti alti; torna lento."],
 "curl scott con manubri":["Seduto alla panca Scott, ascelle sul bordo, dietro delle braccia appoggiato sul cuscino, un manubrio per mano.", "Piega i gomiti portando i manubri verso le spalle; scendi in 2-3 s fino a braccia quasi tese."],
 "pushdown o dip alla macchina":["Seduto alla dip machine, schiena allo schienale, maniglie ai lati del busto all'altezza del petto.", "Spingi in basso fino a braccia tese lungo i fianchi; torna lento fino a gomiti a 90°."],
 "pushdown al cavo":["In piedi davanti al cavo alto, gomiti ai fianchi, avambracci paralleli al pavimento.", "Stendi le braccia verso il basso muovendo solo gli avambracci; torna fino a gomiti a 90°."],
 "pushdown con corda":["In piedi davanti al cavo alto con la corda, gomiti ai fianchi, avambracci paralleli al pavimento.", "Stendi le braccia e in fondo apri la corda ai lati delle cosce; torna fino a gomiti a 90°."],
 "butterfly alla macchina":["Seduto, schiena allo schienale, maniglie aperte all'altezza del petto, gomiti appena piegati.", "Chiudi le braccia davanti al petto finché le mani si avvicinano; torna lento fino a gomiti in linea col corpo, non oltre."],
 "pullover al cavo":["In piedi davanti al cavo alto, busto un po' inclinato, corda o barra con braccia tese in alto.", "Porta le mani giù fino alle cosce a braccia quasi tese, muovendo solo le spalle; torna lento in alto."],
 "reverse fly":["Petto contro lo schienale della pec deck, maniglie davanti all'altezza delle spalle, braccia tese.", "Apri le braccia di lato fino alla linea del corpo, gomiti appena piegati; torna lento."],
 "curl al cavo dietro la schiena":["Di spalle al cavo basso, un passo avanti, maniglia in una mano, braccio teso dietro il fianco.", "Piega il gomito portando la mano verso la spalla, gomito fermo dietro il busto; scendi lento."],
 "pallof press":["Di fianco al cavo all'altezza del petto, maniglia con due mani al centro del petto, piedi larghi.", "Spingi le braccia dritte in avanti senza far ruotare il busto, tieni 2 s e torna al petto."],
 "lat machine presa larga":["Seduto, cosce sotto i rulli, barra presa larga dall'alto, braccia tese.", "Abbassa le scapole e tira la barra al petto alto, gomiti verso i fianchi; risali lento."],
 "panca piana al smith":["Sdraiato sulla panca piana, bilanciere sopra la metà del petto, mani poco più larghe delle spalle.", "Scendi in 2-3 s fino a 3-4 cm dal petto; spingi fino a braccia tese."],
 "chest press inclinata alla macchina":["Seduto con la schiena allo schienale, maniglie all'altezza del petto alto.", "Spingi in avanti e in alto fino a braccia quasi tese; torna in 2-3 s."],
 "chest press ai cavi in piedi":["In piedi al centro tra due cavi all'altezza del petto, un piede avanti, maniglie vicino al petto, gomiti a 45°.", "Spingi in avanti fino a braccia quasi tese, mani che si avvicinano davanti al petto; torna in 2-3 s."],
 "piegamenti zavorrati":["Mani poco più larghe delle spalle, corpo dritto da testa a talloni, zavorra sulla parte alta della schiena.", "Scendi con i gomiti a 45° finché il petto sfiora il pavimento, poi spingi fino a braccia tese senza far cadere il bacino."],
 "chest press altra macchina (hammer)":["Seduto con la schiena allo schienale, sedile regolato con le maniglie all'altezza del petto.", "Spingi in avanti fino a braccia quasi tese, poi torna in 2-3 s finché le mani arrivano vicino al petto."],
 "panca piana con manubri":["Sdraiato sulla panca piana, manubri ai lati del petto, gomiti a 45° dal busto, scapole strette.", "Spingi in alto fino a braccia tese sopra il petto; scendi in 2-3 s fermandoti prima che la spalla tiri."],
 "lat machine a un braccio":["Seduto con le cosce bloccate, una maniglia in mano, braccio teso sopra la testa.", "Tira il gomito giù verso il fianco fino a portare la mano vicino alla spalla; risali lento allungando il fianco."],
 "pulldown presa stretta":["Seduto con le cosce bloccate, maniglia stretta a V, braccia tese sopra la testa.", "Tira la maniglia verso lo sterno con i gomiti vicini al busto e il petto in fuori; risali controllato."],
 "panca inclinata con manubri":["Panca a 30°, manubri ai lati del petto alto, gomiti a 45° dal busto, scapole strette.", "Spingi in alto fino a braccia tese; scendi in 2-3 s fermandoti prima che la spalla tiri."],
 "rematore t-bar con appoggio":["Petto sul cuscino della T-bar, piedi saldi, maniglie in mano a braccia tese.", "Tira i gomiti indietro vicino ai fianchi fino a stringere le scapole; scendi lento fino a braccia tese."],
 "rematore manubrio su panca":["Mano e ginocchio dello stesso lato sulla panca, schiena piatta, manubrio nell'altra mano a braccio teso.", "Porta il gomito indietro verso l'anca fino al fianco, senza ruotare il busto; scendi lento."],
 "rematore manubri petto su panca inclinata":["Petto sul cuscino di una panca inclinata a 30-45°, piedi a terra, un manubrio per mano, braccia tese.", "Porta i gomiti indietro vicino ai fianchi fino alle costole basse, stringi le scapole, scendi lento."],
 "alzate laterali alla macchina":["Seduto con il petto contro il cuscino, braccia lungo i fianchi, cuscinetti appoggiati sopra i gomiti.", "Alza i gomiti di lato fino all'altezza delle spalle senza alzare le spalle; scendi in 2-3 s."],
 "curl al cavo basso":["In piedi davanti al cavo basso, barra o maniglia in mano, gomiti fermi ai fianchi.", "Piega i gomiti portando la barra verso le spalle senza muovere i gomiti in avanti; scendi in 2-3 s fino a braccia tese."],
 "curl bilanciere ez":["In piedi, bilanciere EZ nelle impugnature inclinate, braccia tese, gomiti ai fianchi.", "Piega i gomiti fino a portare il bilanciere al petto senza dondolare il busto; scendi in 2-3 s."],
 "curl manubri in piedi":["In piedi, un manubrio per mano lungo i fianchi, palmi in avanti, gomiti fermi ai fianchi.", "Piega i gomiti fino alle spalle senza dondolare il busto; scendi in 2-3 s fino a braccia tese."],
 "curl a martello":["In piedi, un manubrio per mano lungo i fianchi, palmi uno verso l'altro.", "Piega i gomiti tenendo i palmi rivolti verso l'interno fino alle spalle; scendi in 2-3 s, gomiti fermi."],
 "french press ez su panca":["Sdraiato sulla panca piana, bilanciere EZ a braccia tese sopra il petto, presa stretta.", "Piega solo i gomiti portando il bilanciere verso la fronte, gomiti puntati in alto; distendi fino a braccia tese."],
 "estensioni manubrio sopra la testa":["Seduto con schienale, un manubrio tenuto a due mani sopra la testa, braccia tese.", "Piega i gomiti portando il manubrio dietro la testa, gomiti stretti e puntati in alto; distendi fino a braccia tese."],
 "skull crusher con manubri":["Sdraiato sulla panca piana, un manubrio per mano a braccia tese sopra il petto, palmi uno verso l'altro.", "Piega solo i gomiti portando i manubri ai lati della testa; distendi fino a braccia tese senza aprire i gomiti."],
 "extrarotazione con elastico":["In piedi, elastico all'altezza del gomito, gomito piegato a 90° vicino al fianco, asciugamano arrotolato tra gomito e busto.", "Ruota l'avambraccio verso l'esterno tenendo il gomito fermo al fianco; torna lento."],
 "extrarotazione da sdraiato con manubrio":["Sdraiato sul fianco, gomito del braccio sopra piegato a 90° e appoggiato al fianco, manubrio davanti alla pancia.", "Ruota l'avambraccio verso l'alto tenendo il gomito attaccato al fianco; scendi lento."],
 "salti laterali sopra un ostacolo":["In piedi a lato di un ostacolo basso, piedi alla larghezza delle anche, ginocchia morbide.", "Salta di lato sopra l'ostacolo e atterra morbido sugli avampiedi, ginocchia in linea con i piedi; ripeti dall'altra parte."],
 "lateral bound con arrivo bloccato":["In piedi su una gamba, ginocchio leggermente piegato, busto appena inclinato in avanti.", "Spingi di lato e atterra sull'altra gamba, ferma 2 s in equilibrio con il ginocchio sopra il piede; poi torna."],
 "squat jump":["In piedi, piedi alla larghezza delle spalle, braccia pronte a spingere.", "Scendi a mezzo squat e salta in alto più che puoi; atterra morbido a ginocchia piegate e fermati prima della ripetizione successiva."],
 "salto in lungo da fermo":["In piedi, piedi alla larghezza delle anche, braccia indietro.", "Piega anche e ginocchia e salta in avanti con le braccia; atterra morbido su entrambi i piedi e fermati in equilibrio."],
 "hack squat":["Schiena e spalle contro lo schienale della macchina, piedi a metà pedana alla larghezza delle spalle.", "Scendi in 2-3 s finché le cosce sono parallele alla pedana, ginocchia in linea con i piedi; spingi su."],
 "pressa 45°":["Seduto con schiena e bacino contro lo schienale, piedi a metà pedana alla larghezza delle spalle.", "Scendi finché le ginocchia arrivano verso il petto senza staccare il bacino; spingi senza bloccare le ginocchia."],
 "squat al smith":["Bilanciere dello Smith sulla parte alta della schiena, piedi poco avanti rispetto al bilanciere, alla larghezza delle spalle.", "Scendi finché le cosce sono parallele al pavimento, ginocchia in linea con i piedi; spingi su con la schiena dritta."],
 "goblet squat":["In piedi, piedi alla larghezza delle spalle, un manubrio tenuto verticale contro il petto.", "Scendi tra le ginocchia tenendo il busto dritto fino a cosce parallele o più; spingi su dai talloni."],
 "stacco rumeno con manubri":["In piedi, un manubrio per mano davanti alle cosce, ginocchia appena piegate, schiena dritta.", "Spingi il bacino indietro facendo scorrere i manubri lungo le gambe fino a metà tibia; torna su spingendo il bacino avanti."],
 "good morning":["Bilanciere sulla parte alta della schiena, piedi alla larghezza delle anche, ginocchia appena piegate.", "Spingi il bacino indietro e inclina il busto con la schiena dritta finché senti tirare i femorali; torna su."],
 "pull-through al cavo":["Di spalle al cavo basso, corda tra le gambe tenuta a due mani, un passo avanti, ginocchia appena piegate.", "Spingi il bacino indietro lasciando passare la corda tra le gambe; torna dritto stringendo i glutei."],
 "affondi camminati":["In piedi, un manubrio per mano lungo i fianchi, busto dritto.", "Fai un passo lungo e scendi finché il ginocchio dietro sfiora il pavimento; spingi sul piede avanti e porta avanti l'altra gamba."],
 "step-up su panca":["In piedi davanti a una panca, un piede appoggiato tutto sopra, un manubrio per mano.", "Sali spingendo sul piede sopra la panca senza aiutarti con quello a terra; scendi lento."],
 "split squat al smith":["Bilanciere dello Smith sulla schiena, un piede avanti e uno indietro sulla punta, busto dritto.", "Scendi in verticale finché il ginocchio dietro sfiora il pavimento; spingi sul piede avanti."],
 "affondi indietro con manubri":["In piedi, un manubrio per mano lungo i fianchi, piedi alla larghezza delle anche.", "Fai un passo indietro e scendi finché il ginocchio dietro sfiora il pavimento; spingi sul piede avanti per tornare su."],
 "leg curl seduto, discesa in 4 s":["Seduto, rullo sotto i polpacci, cuscino fermo sopra le cosce, ginocchia allineate al perno.", "Piega le ginocchia portando i talloni sotto il sedile; torna in 4 s fino a gambe quasi tese."],
 "glute-ham raise":["Caviglie bloccate sotto i rulli, ginocchia sul cuscino, busto dritto e verticale.", "Scendi in avanti controllando con i femorali fino a busto orizzontale; risali piegando le ginocchia, corpo dritto."],
 "adduttori alla macchina":["Seduto con la schiena allo schienale, cuscinetti all'interno delle ginocchia, gambe aperte.", "Chiudi le gambe fino a far toccare i cuscinetti; riapri lento fino a sentire l'allungamento."],
 "copenhagen a leva corta (ginocchio)":["Sul fianco, appoggiato sull'avambraccio, ginocchio della gamba sopra appoggiato su una panca.", "Solleva il bacino spingendo con l'interno del ginocchio sulla panca, corpo dritto; tieni la posizione."],
 "calf alla pressa":["Seduto alla pressa, avampiedi sul bordo basso della pedana, gambe quasi tese.", "Spingi sulle punte fino alla massima estensione della caviglia; scendi lento sotto il bordo per allungare i polpacci."],
 "calf al smith":["In piedi sotto lo Smith con il bilanciere sulla schiena, avampiedi su un rialzo, talloni fuori.", "Sali sulle punte il più in alto possibile; scendi lento con i talloni sotto il rialzo."],
 "calf a una gamba con manubrio":["In piedi su un gradino con l'avampiede di una gamba, manubrio nella mano dello stesso lato, l'altra mano a un appoggio.", "Sali sulla punta il più in alto possibile; scendi lento con il tallone sotto il gradino."],
 "lancio rotazionale palla medica":["Di fianco a un muro, palla medica a due mani all'altezza della pancia, piedi alla larghezza delle spalle.", "Ruota anche e busto lontano dal muro e lancia la palla contro il muro con una rotazione esplosiva; riprendila."],
 "woodchop con elastico":["Di fianco al punto d'ancoraggio alto, elastico a due mani sopra la spalla, piedi alla larghezza delle spalle.", "Tira in diagonale verso l'anca opposta ruotando anche e busto insieme, braccia quasi tese; torna controllato."],
 "woodchop con manubrio":["In piedi, un manubrio tenuto a due mani sopra una spalla, piedi alla larghezza delle spalle.", "Porta il manubrio in diagonale verso il ginocchio opposto ruotando anche e busto insieme; torna su controllato."],
 "shoulder press alla macchina":["Seduto con la schiena allo schienale, maniglie all'altezza delle spalle.", "Spingi in alto fino a braccia quasi tese senza inarcare la schiena; scendi in 2-3 s."],
 "lento al smith":["Seduto su una panca verticale dentro lo Smith, bilanciere davanti al mento, mani poco più larghe delle spalle.", "Spingi in alto fino a braccia tese; scendi in 2-3 s fino all'altezza del mento."],
 "arnold press":["Seduto con schienale, manubri davanti alle spalle con i palmi verso di te.", "Spingi in alto ruotando i palmi in avanti fino a braccia tese; scendi ruotando all'indietro."],
 "pulldown a un braccio al cavo":["Inginocchiato o in piedi davanti al cavo alto, maniglia in una mano, braccio teso sopra la testa.", "Tira il gomito giù verso il fianco fino a portare la mano vicino alla spalla; risali lento."],
 "pullover con manubrio":["Sdraiato sulla panca, un manubrio tenuto a due mani sopra il petto, gomiti appena piegati.", "Porta il manubrio dietro la testa fino a sentire l'allungamento dei dorsali; torna sopra il petto. Fermati prima se la spalla tira davanti."],
 "rematore alla macchina":["Seduto con il petto contro il cuscino, maniglie in mano a braccia tese.", "Tira i gomiti indietro fino a stringere le scapole, petto fermo sul cuscino; torna lento."],
 "rematore t-bar":["Busto inclinato a 45° con la schiena dritta, ginocchia piegate, maniglie della T-bar a braccia tese.", "Tira i gomiti indietro vicino ai fianchi fino a portare i dischi al petto; scendi lento senza alzare il busto."],
 "reverse fly alla macchina":["Seduto con il petto contro il cuscino, maniglie avanti a braccia tese all'altezza delle spalle.", "Apri le braccia all'indietro fino in linea con le spalle, gomiti appena piegati; torna lento."],
 "face pull con elastico":["In piedi davanti all'elastico agganciato all'altezza del viso, capi in mano, braccia tese.", "Tira verso la fronte aprendo i gomiti in alto e ruotando le mani verso l'esterno; torna lento."],
 "reverse fly con manubri a busto flesso":["Busto inclinato in avanti quasi orizzontale, schiena dritta, un manubrio per mano sotto il petto.", "Apri le braccia di lato fino all'altezza delle spalle, gomiti appena piegati; scendi lento."],
 "curl alla macchina":["Seduto con le ascelle sul bordo del cuscino, braccia tese, gomiti allineati al perno.", "Piega i gomiti fino alle spalle; scendi in 2-3 s fino a braccia quasi tese."],
 "curl al cavo":["In piedi davanti al cavo basso, barra o maniglia in mano, gomiti fermi ai fianchi.", "Piega i gomiti portando la barra verso le spalle senza muovere i gomiti in avanti; scendi in 2-3 s."],
 "curl scott con manubrio":["Seduto alla panca Scott, braccio appoggiato sul cuscino, manubrio in mano a braccio quasi teso.", "Piega il gomito portando il manubrio alla spalla; scendi in 2-3 s senza staccare il braccio."],
 "dip alle parallele":["In appoggio sulle parallele a braccia tese, busto appena inclinato in avanti, zavorra alla cintura se serve.", "Scendi piegando i gomiti finché le spalle sono all'altezza dei gomiti; spingi fino a braccia tese. Fermati prima se la spalla tira davanti."],
 "estensioni al cavo sopra la testa":["Di spalle al cavo, corda tenuta dietro la testa, un piede avanti, busto inclinato, gomiti in alto.", "Distendi le braccia in avanti sopra la testa tenendo i gomiti fermi; torna lento fino a sentire l'allungamento."],
 "kickback con manubri":["Busto inclinato in avanti quasi orizzontale, un manubrio per mano, gomiti alti attaccati ai fianchi.", "Distendi le braccia indietro fino a tese senza muovere i gomiti; torna lento a 90°."],
 "estensione del polso con elastico":["Seduto, avambraccio appoggiato sulla coscia con il palmo in basso, elastico sotto il piede e in mano.", "Porta il dorso della mano verso l'alto muovendo solo il polso; scendi lento."],
 "flexbar (tyler twist)":["Flexbar verticale davanti a te: mano del braccio della racchetta in basso con il polso piegato all'indietro, l'altra in alto.", "Ruota la mano in alto per torcere la barra, poi distendi le braccia in avanti e lascia tornare la torsione in 4 s con la mano dolente."],
 "croci ai cavi":["In piedi al centro tra due cavi alti, un piede avanti, braccia aperte con i gomiti appena piegati.", "Chiudi le braccia ad arco davanti al petto senza cambiare la piega dei gomiti; riapri lento."],
 "chest press leggera alla macchina":["Seduto con la schiena contro lo schienale, sedile regolato con le maniglie all'altezza del petto.", "Spingi in avanti fino a braccia quasi tese, poi torna in 2-3 s finché le mani arrivano vicino al petto."],
 "croci con manubri su panca piana":["Sdraiato sulla panca piana, manubri sopra il petto con i palmi uno verso l'altro, gomiti appena piegati.", "Apri le braccia ad arco fermandoti prima che la spalla tiri; richiudi sopra il petto."],
 "croci su panca inclinata con manubri":["Panca a 30°, manubri sopra il petto con i palmi uno verso l'altro, gomiti appena piegati.", "Apri le braccia ad arco fermandoti prima che la spalla tiri; richiudi sopra il petto."],
 "pullover alla macchina":["Seduto con la schiena allo schienale, gomiti sui cuscinetti, braccia in alto dietro la testa.", "Porta i gomiti giù in avanti fino ai fianchi; torna lento fino a sentire l'allungamento dei dorsali."],
 "reverse fly ai cavi":["In piedi al centro tra due cavi all'altezza delle spalle, cavi incrociati: mano destra sul cavo sinistro e viceversa.", "Apri le braccia all'indietro fino in linea con le spalle, gomiti appena piegati; torna lento."],
 "reverse fly con manubri":["Petto appoggiato su una panca inclinata a 30-45°, un manubrio per mano, braccia verso il pavimento.", "Apri le braccia di lato fino all'altezza delle spalle, gomiti appena piegati; scendi lento."],
 "kickback al cavo":["Busto inclinato in avanti davanti al cavo basso, maniglia in una mano, gomito alto attaccato al fianco.", "Distendi il braccio indietro fino a teso senza muovere il gomito; torna lento a 90°."],
 "pallof press con elastico":["In piedi di fianco all'ancoraggio dell'elastico, all'altezza del petto, mani al petto, piedi alla larghezza delle spalle.", "Spingi le mani in avanti fino a braccia tese senza farti ruotare il busto; tieni 2 s e torna."],

let tEnd=0,tInt=null,tOn=false,tTot=60,tWarn=false,tLbl="";const T=id=>document.getElementById(id);
let tPlus=0;
function startTimer(sec,label,plus,end){tPlus=plus||0;tLbl=label;tEnd=end||Date.now()+sec*1000;tTot=sec;S.timer={end:tEnd,tot:sec,lbl:label,plus:tPlus};save();tWarn=sec<=10;tOn=true;T("tlbl").textContent="Recupero · "+label+(tPlus?" · +"+tPlus+"\u00a0s":"");T("timer").classList.remove("over");clearInterval(tInt);tick();tInt=setInterval(tick,250)}
function tick(){if(!tOn)return;const left=Math.round((tEnd-Date.now())/1000),a=Math.abs(left),txt=(left<0?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0");
  setNum(T("tval"),txt);const inl=document.getElementById("restIn");if(inl)setNum(inl.querySelector(".tv"),txt);
  const fr=Math.max(0,Math.min(1,(tEnd-Date.now())/1000/tTot));document.querySelectorAll("#timer .ra,#restIn .ra").forEach(c=>c.style.strokeDashoffset=(100*(1-fr)).toFixed(1));
  T("timer").hidden=!!inl;
  // 10 secondi alla fine: vibrazione breve e anello che pulsa
  const soon=left<=10&&left>0;T("timer").classList.toggle("soon",soon);if(inl)inl.classList.toggle("soon",soon);
  if(soon&&!tWarn){tWarn=true;try{navigator.vibrate&&navigator.vibrate([90,70,90])}catch(e){}}
  if(left>10)tWarn=false;
  if(left<=0&&!T("timer").classList.contains("over")){T("timer").classList.add("over");T("tlbl").textContent="Recupero finito";try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}beep()}
  if(left<=0&&inl&&!inl.classList.contains("over")){inl.classList.add("over");inl.querySelector(".tl").textContent="Recupero finito"}
  if(left>0&&inl&&inl.classList.contains("over")){inl.classList.remove("over");inl.querySelector(".tl").textContent="Recupero"}}
function stopTimer(){clearInterval(tInt);tOn=false;if(S.timer){delete S.timer;save()}T("timer").hidden=true;const inl=document.getElementById("restIn");if(inl)inl.remove()}
function addRest(){tEnd+=15000;tTot=Math.max(tTot,(tEnd-Date.now())/1000);if(S.timer){S.timer.end=tEnd;S.timer.tot=tTot;save()}T("timer").classList.remove("over");tick()}

const PAIRS=[["petto","dorso"],["quadricipiti","femorali"],["tricipiti","bicipiti"]];
function balanceAt(at){
  const A=rankAll(null,at),out=[];if(!A.BW)return out;
  for(const [a,b] of PAIRS){const x=A.mus[a],y=A.mus[b];if(!x||!y||x.none||y.none)continue;
    const d=x.v-y.v;if(Math.abs(d)>=2)out.push({kind:"rank",lo:d>0?y:x,hi:d>0?x:y,d:Math.abs(d)})}
  const end=addDays(at||today(),1),v=volRange(addDays(end,-14),end),push=v.petto,pull=v.dorso;
  if(push+pull>=12&&(pull<push*2/3||push<pull*2/3))out.push({kind:"vol",push,pull});

function buildReview(c){
  if(!c)return null;const from=new Date(c.from+"T00:00:00"),to=new Date(c.to+"T00:00:00");
  const ss=S.sessions.filter(s=>!s.deload&&s.date.slice(0,10)>=c.from&&s.date.slice(0,10)<c.to).sort((a,b)=>a.date.localeCompare(b.date));
  if(ss.length<3)return null;
  const wk=Math.max(1,(to-from)/(7*864e5));
  const grp={};for(const s of ss)for(const id in s.sets){const k=String(exName(id)).trim().toLowerCase();(grp[k]=grp[k]||new Set()).add(id)}
  const ex=[];for(const k in grp){const ids=[...grp[k]],e=exById(ids[0]);if(["perf","prev","time"].includes(e.t))continue;
    const m=s=>Math.max(0,...ids.flatMap(id=>(s.sets[id]||[]).map(x=>metricOf(e,x))));
    const hs=ss.filter(s=>ids.some(id=>s.sets[id])).map(m).filter(v=>v>0);if(hs.length<2)continue;
    const ch=(hs[hs.length-1]-hs[0])/hs[0],st=stallBy(phaseAt(c.to),hs.slice(-4).reverse());
    ex.push({n:exName(ids[0]),ch,st,t:e.t,n0:hs.length})}
  const vr=volRange(from,to),vol=RMU.map(([k,n])=>({k,n,v:vr[k]/wk}));
  const eff={comp:{easy:0,ok:0,hard:0},iso:{easy:0,ok:0,hard:0}};
  for(const s of ss)for(const id in (s.eff||{})){const e=exById(id),g=e.t==="comp"?"comp":e.t==="iso"?"iso":null,v=s.eff[id];if(g&&eff[g][v]!=null)eff[g][v]++}
  const W=S.body.filter(x=>x.kg!=null&&x.d>=c.from&&x.d<=c.to).sort((a,b)=>a.d.localeCompare(b.d));
  let bw=null;if(W.length>=2){const a=W[0],b=W[W.length-1],w=Math.max(1,(new Date(b.d)-new Date(a.d))/(7*864e5));if(w>=2)bw={a:a.kg,b:b.kg,w,pct:(b.kg-a.kg)/a.kg/w*100}}
  return {c,n:ss.length,wk,ex,vol,eff,bw,ph:phaseAt(addDays(to,-1)),bal:balanceAt(addDays(to,-1))};
}

function progGroups(seen){
  const used=new Set(),out=[];

  const rest=seen.filter(id=>!used.has(id));if(rest.length)out.push(["Altri",rest]);
  return out;
}

function niceTicks(min,max,n=4){const span=max-min||1,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),err=step0/mag,step=(err>=7.5?10:err>=3.5?5:err>=1.5?2:1)*mag;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+1e-9;v+=step)t.push(+v.toFixed(6));return t}
function lineChart(el,data,unit,noRec){

  const ys=data.map(d=>d.y),ticks=niceTicks(Math.min(...ys)*0.97,Math.max(...ys)*1.02);
  const y0=ticks[0],y1=ticks[ticks.length-1],x0=+data[0].x,x1=+data[data.length-1].x;
  const X=v=>m.l+(W-m.l-m.r)*((+v-x0)/((x1-x0)||1)),Y=v=>m.t+(H-m.t-m.b)*(1-(v-y0)/((y1-y0)||1));
  const path=data.map((d,i)=>(i?"L":"M")+X(d.x).toFixed(1)+" "+Y(d.y).toFixed(1)).join(" ");
  const area=path+` L${X(data[data.length-1].x).toFixed(1)} ${Y(y0)} L${X(data[0].x).toFixed(1)} ${Y(y0)} Z`;

   ${ticks.map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}" style="stroke:var(--line)" stroke-width="1"/><text x="${m.l-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${fk(t)}</text>`).join("")}

 ${phaseBands(new Date(x0),new Date(x1)).map(b=>`<rect x="${X(b.a).toFixed(1)}" y="${m.t}" width="${(X(b.b)-X(b.a)).toFixed(1)}" height="${H-m.t-m.b}" style="fill:${PH[b.ph].col};opacity:.12"/><text x="${(X(b.a)+3).toFixed(1)}" y="${m.t+10}" font-size="11" font-weight="700" style="fill:${PH[b.ph].col}">${PH[b.ph].n}</text>`).join("")}
   ${data.map(d=>d.dl?`<rect x="${X(d.x)-9}" y="${m.t}" width="18" height="${H-m.t-m.b}" rx="4" style="fill:var(--pad);opacity:.14"/>`:"").join("")}
   <path d="${area}" fill="url(#ga)"/>

   ${(()=>{const bi=ys.lastIndexOf(Math.max(...ys));return data.map((d,i)=>{const hi=i===data.length-1||i===bi;return `<circle cx="${X(d.x)}" cy="${Y(d.y)}" r="${hi?5.5:3.5}" style="fill:${hi?"var(--hot)":"var(--bg)"};stroke:var(--hot)" stroke-width="2"/>`}).join("")+`<text x="${Math.min(Math.max(X(data[bi].x),m.l+20),W-m.r-20)}" y="${Math.max(Y(data[bi].y)-11,10)}" text-anchor="middle" font-size="11" font-weight="800" style="fill:var(--fg)">${noRec?"":"Record"}</text>`})()}
   <line id="xh" y1="${m.t}" y2="${H-m.b}" stroke="#8b97a6" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>

  </svg><div class="tip" hidden></div>`;
  const svg=el.querySelector("svg"),tip=el.querySelector(".tip"),xh=el.querySelector("#xh");

    const d=data[bi];xh.setAttribute("x1",X(d.x));xh.setAttribute("x2",X(d.x));xh.setAttribute("visibility","visible");

function legRule(d){

  const n1=S.week[(d+1)%7]||{},n2=S.week[(d+2)%7]||{};
  if(!PLAN[p.gym].legs)return n1.padel==="match"&&n2.padel==="match"&&(p.padel||"none")==="none"?`<span class="rule mid">${I("warn")}Partite nei 2 giorni dopo: solo braccia e prevenzione</span>`:"";
  if(p.padel!=="none"&&p.padel)return `<span class="rule bad">✕ Stesso giorno del padel</span>`;
  if(n1.padel==="match")return `<span class="rule bad">✕ Partita il giorno dopo</span>`;

   <button class="btn hot" id="newPlan">Crea nuovo piano</button><p class="msg" id="wmsg"></p></section>
  ${S.archive.length?`<section class="card"><h3>Piani vecchi</h3><p class="note" style="margin:0">Le versioni precedenti dei tuoi piani. Ripristinandone una, quella attuale viene salvata qui al suo posto. Lo storico delle sedute resta sempre.</p>
   <div class="plist">${S.archive.map(v=>{const live=!!PLAN[v.key];return `<div class="arch"><div class="pitem"><div><b>${esc(v.plan.name)}</b><small>${v.why==="eliminato"?"eliminato il":"versione del"} ${fmtShort(v.at)} · ${v.plan.ex.length} ${v.plan.ex.length===1?"esercizio":"esercizi"}${live&&PLAN[v.key].name!==v.plan.name?` · ora "${esc(PLAN[v.key].name)}"`:""}</small></div><button class="sbtn" data-vw="${v.id}">Vedi</button><button class="sbtn" data-rs="${v.id}">Ripristina</button><button class="sbtn danger" data-rmv="${v.id}" aria-label="Elimina versione">✕</button></div>
    <ol class="arx" id="ax-${v.id}" hidden>${v.plan.ex.map(e=>`<li>${esc(e.n)} <span>${e.s}×${e.lo}${e.hi!==e.lo?"-"+e.hi:""}${e.t==="time"?" s":""}</span></li>`).join("")}</ol></div>`}).join("")}</div></section>`:""}
  <section class="card"><h3>Scarico</h3><p class="note" style="margin:0">${deloadOn()?`In corso fino a ${fmtShort(S.deload.to)}.`:"Una settimana con metà serie, stessi carichi e 3-4 ripetizioni in canna. L'app te lo propone quando servirebbe; avvialo tu nella settimana di un torneo."}</p><button class="btn ${deloadOn()?"ghost":""}" id="dlBtn">${deloadOn()?"Termina scarico":"Inizia settimana di scarico"}</button>${(S.cycles||[]).length?`<button class="sbtn" id="rvBtn" style="margin-top:10px">Revisione dell'ultimo ciclo</button>`:""}</section>
  <section class="card"><h3>Fase</h3><div class="seg" id="segPh" role="group" aria-label="Fase">${Object.entries(PH).map(([k,v])=>`<button data-ph="${k}" aria-pressed="${phaseAt()===k}">${v.n}</button>`).join("")}</div>
   <p class="note" style="margin:10px 0 0">${phaseStart()?`${PH[phaseAt()].n} dal ${fmtShort(phaseStart()+"T12:00:00")}. `:""}${{massa:"Peso +0,25-0,5% a settimana. Esercizio \"Fermo\" se non migliora in 3 sedute.",def:"Peso −0,5-1% a settimana, avviso se cali più dell'1%. L'obiettivo è tenere i carichi: l'avviso scatta solo se il massimale cala oltre il 5% per 2 sedute.",mant:"Peso stabile, ±0,25% a settimana. Progressione come in massa."}[phaseAt()]} Cambia anche la revisione del ciclo e lo sfondo dei grafici. L'app non tocca la dieta.</p></section>
  <section class="card"><h3>Durante l'allenamento</h3>
   <div class="tgl"><div><b>Schermo sempre acceso</b><small>Dalla prima serie fino a quando salvi la seduta.${"wakeLock" in navigator?"":" Questo browser non lo permette."}</small></div><button role="switch" data-tg="awake" aria-checked="${S.awake!==false}" aria-label="Schermo sempre acceso"></button></div>
   <div class="tgl"><div><b>Suono a fine recupero</b><small>Tre bip. Su iPhone la fine del recupero non vibra: si sente solo il suono. Con il tasto silenzioso attivo l'iPhone non lo fa sentire, a meno che non attivi l'opzione qui sotto.</small></div><button role="switch" data-tg="sound" aria-checked="${S.sound!==false}" aria-label="Suono a fine recupero"></button></div>
   ${S.sound!==false?`<div class="tgl"><div><b>Bip anche col silenzioso</b><small>Si sente anche con il tasto silenzioso, ma di solito mette in pausa la musica.</small></div><button role="switch" data-tgf="loud" aria-checked="${!!S.loud}" aria-label="Bip anche col silenzioso"></button></div>`:""}
   <div class="tgl"><div><b>Recupero adattivo</b><small>30 s in più dopo una serie sotto le ripetizioni o segnata "Al limite" su un multiarticolare.</small></div><button role="switch" data-tg="adrest" aria-checked="${S.adrest!==false}" aria-label="Recupero adattivo"></button></div>
  </section>
  <section class="card"><h3>Stile</h3><div class="skins" id="skins">${SKINS.map(([k,l,g])=>`<button data-s="${k}" aria-pressed="${(S.skin||"vetro")===k}"><i style="background:${g}"></i>${l}</button>`).join("")}</div>
   <div class="vars" role="group" aria-label="Colore dello stile"><span>Colore: ${SKVARS[S.skin||"vetro"][(S.vars||{})[S.skin||"vetro"]||0][0]}</span>${SKVARS[S.skin||"vetro"].map(([l,g],i)=>`<button data-var="${i}" aria-label="${l}" aria-pressed="${((S.vars||{})[S.skin||"vetro"]||0)===i}" style="background:${g}"></button>`).join("")}</div></section>
  <section class="card"><h3>Regole che l'app applica</h3>
   <ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px">
    <li>Ripetizioni prima, carico poi: +1 ripetizione per serie finché chiudi tutto al limite alto del range, poi aumenta il carico e riparti dal basso. L'aumento segue l'attrezzo: +5 kg macchine e cavi (pacco pesi), +2,5 kg bilanciere e Smith, +2 kg manubri e zavorra con kettlebell. Sui multiarticolari pesanti, se il 2,5% (parte alta) o il 5% (gambe) del carico è più del gradino, sale di quello, arrotondato al gradino.</li>
    <li>Dopo l'ultima serie puoi dire com'era. Facile: due ripetizioni in più invece di una, oppure aumento doppio se resta entro il 10% del carico. Al limite su un multiarticolare a fine range: il carico resta fermo finché non chiudi con le ripetizioni in canna previste.</li>
    <li>Isolamento e prevenzione con un gradino grosso rispetto al carico (oltre il 15%, es. extrarotazione da 5 a 10 kg): prima porti le ripetizioni fino a 5 oltre il range, poi sali di peso.</li>
    <li>Due sedute di fila sotto il minimo del range e ripetizioni totali non salite: -10% e riparti dal basso. Se il -10% vuol dire scendere più del 15% (gradino grosso), carico fermo e una ripetizione in più per serie.</li>
    <li>Esercizio fermo (né kg né massimale stimato saliti in 3 sedute): prova una variante o togli una serie per due settimane.</li>
    <li>Salti: ripetizioni fisse, si progredisce in altezza o distanza. Nordic: meno aiuto dall'elastico. Copenhagen: +5 s fino a 30, poi versione più dura.</li>
    <li>Gambe mai nello stesso giorno del padel e mai il giorno prima di una partita.</li>
    <li>Venerdì prima di due partite (sabato e domenica): solo braccia, Copenhagen, cuffia e polso.</li>
    <li>Padel e palestra nello stesso giorno: una serie in meno sulle spinte sopra la testa. Giorno di partita o energia bassa: una serie in meno su tutto.</li>
    <li>Scarico quando serve, non a calendario: l'app lo propone dopo 6 settimane senza scarico o con 3+ esercizi fermi. Serie dimezzate, stessi carichi, 3-4 in canna. Le sedute di scarico non contano per la progressione.</li>
   </ul></section>
  <section class="card"><h3>Backup</h3><p class="note" style="margin:0">I dati stanno solo su questo telefono. Salva un backup ogni tanto.</p>
   <div class="row"><button class="btn" id="exp">Esporta backup</button><label class="btn" style="flex-direction:column;gap:2px;text-align:center">Importa backup<small style="font-size:12px;font-weight:500;opacity:.75">sostituisce i dati attuali</small><input type="file" id="imp" accept="application/json" hidden></label></div>
   <button class="btn danger" id="wipe">Cancella tutti i dati</button><p class="msg" id="bmsg" aria-live="polite"></p></section>`;
  document.getElementById("back").onclick=()=>go("set");
  document.querySelectorAll("#segOrd button").forEach(b=>b.onclick=()=>{S.order=b.dataset.v;save();renderSettings()});
  document.getElementById("dlBtn").onclick=()=>{const on=deloadOn();on?endDeload():startDeload();renderSettings();if(!on)reviewSheet(S.cycles[S.cycles.length-1])};
  const rvb=document.getElementById("rvBtn");if(rvb)rvb.onclick=()=>reviewSheet(S.cycles[S.cycles.length-1]);
  document.querySelectorAll("#skins button").forEach(b=>b.onclick=()=>{S.skin=b.dataset.s;save();applySkin();renderSettings()});
  document.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{setPhase(b.dataset.ph);renderSettings()});
  document.querySelectorAll("[data-tgf]").forEach(b=>b.onclick=()=>{const k=b.dataset.tgf;S[k]=!S[k];save();if(k==="loud"){audioUnlock();beep()}renderSettings()});
  document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{const k=b.dataset.tg;S[k]=S[k]===false;save();if(k==="sound"&&S.sound){audioUnlock();beep()}renderSettings()});
  document.querySelectorAll(".vars [data-var]").forEach(b=>b.onclick=()=>{S.vars=S.vars||{};S.vars[S.skin||"vetro"]=+b.dataset.var;save();applySkin();renderSettings()});
  document.getElementById("newPlan").onclick=()=>{editPlan={key:null,name:"",sub:"",legs:false,ex:[blankEx()]};go("edit")};
  document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{const k=b.dataset.ed,P=PLAN[k];editPlan=JSON.parse(JSON.stringify({key:k,name:P.name,sub:P.sub||"",legs:!!P.legs,ex:P.ex}));go("edit")});
  document.querySelectorAll("[data-vw]").forEach(b=>b.onclick=()=>{const l=document.getElementById("ax-"+b.dataset.vw);l.hidden=!l.hidden;b.textContent=l.hidden?"Vedi":"Chiudi"});
  document.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{const v=S.archive.find(x=>x.id===b.dataset.rs);if(!v)return;S.archive=S.archive.filter(x=>x!==v);if(PLAN[v.key])archivePlan(v.key,"modificato");S.plans[v.key]=JSON.parse(JSON.stringify(v.plan));delete S.draft[v.key];rebuild();save();renderSettings();const m=document.getElementById("wmsg");m.className="msg ok";m.textContent=`Ripristinato "${v.plan.name}".`});
  document.querySelectorAll("[data-rmv]").forEach(b=>b.onclick=()=>{if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="Sicuro?";return}S.archive=S.archive.filter(x=>x.id!==b.dataset.rmv);save();renderSettings()});
  document.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>{const P=PLAN[b.dataset.dup];editPlan=JSON.parse(JSON.stringify({key:null,name:P.name+" (copia)",sub:P.sub||"",legs:!!P.legs,ex:P.ex.map(e=>({...e,lib:e.lib||e.id}))}));go("edit")});
  document.querySelectorAll("[data-delp]").forEach(b=>b.onclick=()=>{if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="Sicuro?";return}const k=b.dataset.delp;archivePlan(k,"eliminato");delete S.plans[k];for(const d in S.week)if(S.week[d].gym===k)S.week[d]={...S.week[d],gym:"none"};for(const d in S.overrides)if(S.overrides[d].gym===k)delete S.overrides[d].gym;delete S.draft[k];rebuild();save();renderSettings()});
  const bm=document.getElementById("bmsg");
  document.getElementById("exp").onclick=()=>{if(dlBackup()){bm.className="msg ok";bm.textContent="Backup scaricato."}else{bm.className="msg err";bm.textContent="Download non riuscito su questo browser."}};
  // Prima di cancellare o importare: copia dei dati attuali e "Annulla" per 10 secondi
  const undoable=(txt)=>{const m=document.getElementById("bmsg");m.className="msg ok";m.innerHTML=`${esc(txt)} <button class="lnk" id="undoD">Annulla</button>`;
    const u=document.getElementById("undoD");const t=setTimeout(()=>{if(u.isConnected)u.remove()},10000);
    u.onclick=()=>{clearTimeout(t);try{S=JSON.parse(localStorage.getItem(KEY+".bak"));rebuild();save();applySkin();renderSettings();document.getElementById("bmsg").textContent="Dati ripristinati."}catch(e){}}};
  const snap=()=>{try{localStorage.setItem(KEY+".bak",JSON.stringify(S))}catch(e){}};
  document.getElementById("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const j=JSON.parse(t);if(!j.sessions)throw 0;snap();S=j;S.plans=S.plans||{};S.swaps=S.swaps||{};S.customAlts=S.customAlts||{};S.archive=S.archive||[];S.body=S.body||[];S.pain=S.pain||{};rebuild();save();applySkin();renderSettings();undoable(`Backup importato: ${j.sessions.length} sedute.`)}).catch(()=>{bm.className="msg err";bm.textContent="File non valido: scegli un backup esportato da Allenati Scemo."})};
  const w=document.getElementById("wipe");w.onclick=()=>{if(w.dataset.arm!=="1"){w.dataset.arm="1";w.textContent="Tocca di nuovo: cancella tutto";clearTimeout(w.t);w.t=setTimeout(()=>{if(w.isConnected){w.dataset.arm="";w.textContent="Cancella tutti i dati"}},4000);return}snap();S={sessions:[],draft:{},week:DEFAULT_WEEK,overrides:{},energy:{},view:"set",plans:{},swaps:{},customAlts:{},archive:[],skin:S.skin};rebuild();save();renderSettings();undoable("Dati cancellati.")};
}


/* ================= EDITOR PIANI ================= */
function blankEx(){return {id:null,n:"",s:3,lo:8,hi:12,rir:"1-2",rest:90,t:"comp",step:5,eq:"mac",side:false,oh:false,ecc:false,ss:"",note:""}}
const edSum=e=>`${e.s}×${e.lo===e.hi?e.lo:e.lo+"-"+e.hi}${e.t==="time"?" s":""} · ${e.rest||0} s · ${({mac:"Macchina",cavl:"Cavo alzate",bar:"Bilanciere",db:"Manubri",zav:"Zavorra"})[eqOf(e)]||"Altro"}`;
function renderEditor(){
  const E=editPlan;
  const lib=Object.keys(BUILTIN).map(k=>`<optgroup label="${esc(BUILTIN[k].name)}">${BUILTIN[k].ex.map(e=>`<option value="${e.id}">${esc(e.n)}</option>${altsOf(e).filter(a=>!a.custom).map(a=>`<option value="${e.id}~${a.k}">  ↳ ${esc(a.n)}</option>`).join("")}`).join("")}</optgroup>`).join("");
  app.innerHTML=`<header class="head"><span class="kicker">${E.key?"Modifica piano":"Nuovo piano"}</span><h1>${esc(E.name||"Piano senza nome")}</h1></header>
  <section class="card ed">
    <label>Nome del piano<input id="pName" value="${esc(E.name)}" maxlength="30" placeholder="Es. Upper D, Full body, Hotel"></label>
    <label>Descrizione breve<input id="pSub" value="${esc(E.sub||"")}" maxlength="60" placeholder="Es. Petto e braccia, 45 minuti"></label>
    <div class="checks"><label><input type="checkbox" id="pLegs" ${E.legs?"checked":""}> Giorno gambe pesante (l'app lo tiene lontano da padel e partite)</label></div>
  </section>
  <div style="display:flex;flex-direction:column;gap:10px">${E.ex.map((e,i)=>`<div class="edx" data-i="${i}">
    <div class="top"><b>${i+1}</b><span class="eds">${esc(edSum(e))}</span>
      <button class="sbtn" data-mv="-1" aria-label="Sposta su" ${i===0?"disabled":""}>↑</button><button class="sbtn" data-mv="1" aria-label="Sposta giù" ${i===E.ex.length-1?"disabled":""}>↓</button><button class="sbtn danger" data-rm aria-label="Elimina esercizio">✕</button></div>
    <input data-f="n" value="${esc(e.n)}" placeholder="Nome esercizio" maxlength="60" aria-label="Nome esercizio ${i+1}">
    <details class="edd" data-more="ed${i}" ${moreOpen.has("ed"+i)||!e.n?"open":""}><summary>Serie, recupero e attrezzo</summary>
    <div class="g3">
      <label>Serie<input data-f="s" inputmode="numeric" value="${e.s}"></label>
      <label>Rip. min${e.t==="time"?" (s)":""}<input data-f="lo" inputmode="numeric" value="${e.lo}"></label>
      <label>Rip. max${e.t==="time"?" (s)":""}<input data-f="hi" inputmode="numeric" value="${e.hi}"></label>
      <label>In canna<input data-f="rir" value="${esc(e.rir)}"></label>
      <label>Recupero (s)<input data-f="rest" inputmode="numeric" value="${e.rest}"></label>
      <label>Gradino kg<input data-f="step" inputmode="decimal" value="${fk(e.step??2.5)}"></label>
    </div>
    <div class="g3" style="grid-template-columns:1fr"><label>Attrezzo (aumento del carico)<select data-f="eq">${EQS.map(([v,l,st])=>`<option value="${v}" ${eqOf(e)===v?"selected":""}>${l}${st?` · +${fk(st)} kg`:" · scegli tu il gradino"}</option>`).join("")}</select></label></div>
    <div class="g3" style="grid-template-columns:1fr"><label>Muscolo<select data-f="mu"><option value="">Nessuno (prevenzione, salti)</option>${MUSCLES.map(m=>`<option value="${m}" ${e.mu===m?"selected":""}>${muLbl(m)}</option>`).join("")}</select></label></div>
    <div class="g3" style="grid-template-columns:2fr 1fr"><label>Tipo<select data-f="t">${TYPES.map(([v,l])=>`<option value="${v}" ${e.t===v?"selected":""}>${l}</option>`).join("")}</select></label><label>Superserie<input data-f="ss" value="${esc(e.ss||"")}" maxlength="3" placeholder="—"></label></div>
    <div class="checks"><label><input type="checkbox" data-f="side" ${e.side?"checked":""}> Per lato</label><label><input type="checkbox" data-f="oh" ${e.oh?"checked":""}> Spinta sopra la testa</label><label><input type="checkbox" data-f="ecc" ${e.ecc?"checked":""}> Eccentrico pesante</label></div>
  </details></div>`).join("")}</div>
  <section class="card ed">
    <label>Aggiungi dalla scheda<select id="fromLib"><option value="">Scegli un esercizio…</option>${lib}</select></label>
    <button class="btn" id="addBlank">Aggiungi esercizio vuoto</button>
  </section>
  <p class="msg" id="emsg" aria-live="polite"></p>
  <div class="row"><button class="btn hot" id="savePlan">Salva piano</button><button class="btn ghost" id="cancelPlan">Annulla</button></div>`;
  document.getElementById("pName").oninput=e=>{E.name=e.target.value};
  document.getElementById("pSub").oninput=e=>{E.sub=e.target.value};
  document.getElementById("pLegs").onchange=e=>{E.legs=e.target.checked};
  document.querySelectorAll(".edx").forEach(row=>{const i=+row.dataset.i,e=E.ex[i];
    row.querySelectorAll("[data-f]").forEach(inp=>{const f=inp.dataset.f;const h=()=>{
      if(inp.type==="checkbox")e[f]=inp.checked;
      else if(["s","lo","hi","rest"].includes(f))e[f]=parseInt(inp.value,10)||0;
      else if(f==="step")e[f]=num(inp.value)||2.5;
      else e[f]=inp.value;
      if(f==="eq"){const q=EQS.find(x=>x[0]===inp.value);if(q&&q[2])e.step=q[2]}
      const sm=row.querySelector(".eds");if(sm)sm.textContent=edSum(e);
      if(f==="t"||f==="eq")renderEditor()};inp.oninput=h;inp.onchange=h});
    row.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const j=i+ +b.dataset.mv;[E.ex[i],E.ex[j]]=[E.ex[j],E.ex[i]];renderEditor()});
    row.querySelector("[data-rm]").onclick=()=>{E.ex.splice(i,1);renderEditor()};
  });
  document.getElementById("fromLib").onchange=e=>{const src=EX[e.target.value];if(!src)return;const c={...src};delete c.day;delete c.base;c.lib=src.base||src.lib||src.id;if(E.ex.some(x=>x.id===c.id))c.id=null;E.ex.push(c);renderEditor();window.scrollTo(0,document.body.scrollHeight)};
  document.getElementById("addBlank").onclick=()=>{E.ex.push(blankEx());renderEditor();window.scrollTo(0,document.body.scrollHeight)};
  document.getElementById("cancelPlan").onclick=()=>{editPlan=null;go("imp")};
  document.getElementById("savePlan").onclick=()=>{
    const m=document.getElementById("emsg");m.className="msg err";
    const name=(E.name||"").trim();
    if(!name){m.textContent="Dai un nome al piano.";return}
    const ex=E.ex.filter(x=>(x.n||"").trim());
    if(!ex.length){m.textContent="Aggiungi almeno un esercizio con il nome.";return}
    for(const x of ex){if(!(x.s>=1&&x.s<=10)){m.textContent=`${x.n}: le serie vanno da 1 a 10.`;return}if(!(x.lo>=1&&x.hi>=x.lo)){m.textContent=`${x.n}: le ripetizioni minime devono essere almeno 1 e non più delle massime.`;return}}
    const key=E.key||("p"+Date.now().toString(36));
    const seen=new Set();
    const out=ex.map((x,i)=>{let id=x.id;if(!id||seen.has(id))id=key+"_"+Math.random().toString(36).slice(2,7);seen.add(id);
      const o={id,n:x.n.trim(),s:x.s,lo:x.lo,hi:x.hi,rir:(x.rir||"").trim()||"1-2",rest:x.rest||0,t:x.t||"comp",step:x.step||2.5};
      for(const f of ["side","oh","ecc","lower"])if(x[f])o[f]=true;if(x.eq)o.eq=x.eq;if(x.mu)o.mu=x.mu;if(x.ss)o.ss=String(x.ss).trim();if(x.note)o.note=x.note;if(x.lib)o.lib=x.lib;return o});
    if(E.key&&PLAN[key])archivePlan(key,"modificato");
    const B=BUILTIN[key];
    S.plans[key]={name,title:B&&B.name===name?B.title:name,sub:(E.sub||"").trim()||`${out.length} esercizi`,legs:!!E.legs,custom:!B,ex:out};
    rebuild();save();editPlan=null;go("imp");
    const wm=document.getElementById("wmsg");if(wm){wm.className="msg ok";wm.textContent=`Piano "${name}" salvato. Assegnalo a un giorno in Settimana o sceglilo in Allenamento.`}
  };
}

/* ================= DEMO ================= */
// Dati di esempio: non si mescolano mai alle sedute vere
function clearDemo(){S.sessions=S.sessions.filter(x=>!x.demo);S.body=S.body.filter(x=>!x.demo)}
function loadDemo(){
  const now=today(),out=[];
  for(let w=7;w>=1;w--){
    for(const [g,off] of [["A",0],["G",1],["B",2],["C",4]]){
      const d=addDays(now,-(w*7)+off-((now.getDay()+6)%7));if(d>=now)continue;
      const sets={};
      for(const ex of PLAN[g].ex){
        const base={a1:50,a2:0,a3:40,a4:45,a5:7.5,a6:10,a7:15,a8:5,g3:70,g4:60,g5:14,g8:40,g9:15,b1:16,b10:15,b2:50,b3:7.5,b4:45,b5:8,b6:20,b7:10,b8:20,b9:6,c1:40,c2:20,c3:5,c4:30,c5:7.5,c6:17.5,c7:15}[ex.id];
        const prog=(7-w);const kg=base!=null?base+Math.floor(prog/2)*(ex.step||2.5):null;
        const reps=Math.min(ex.hi,ex.lo+(prog%2)+(prog%3===0?1:0));
        sets[ex.id]=[...Array(ex.s)].map(()=>({kg:kg!=null&&!["perf","nordic","time"].includes(ex.t)?String(kg):"",reps:String(ex.t==="time"?Math.min(30,20+prog*2):reps)}));
      }
      out.push({id:"demo"+w+g,day:g,date:d.toISOString(),sets,demo:true});
    }
  }
  S.sessions=out;if(!S.body.some(x=>num(x.kg)>0))S.body.push({d:iso(today()),kg:70,demo:true});save();
}

/* ================= BOOT ================= */
applySkin();render();
// Recupero in corso quando iOS ha chiuso l'app: riparte da dove era (se è finito da meno di 10 minuti)
if(S.timer&&S.timer.end>Date.now()-6e5){const x=S.timer;startTimer(x.tot,x.lbl,x.plus,x.end);if(view==="train")renderTrain()}else if(S.timer){delete S.timer;save()}

if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
