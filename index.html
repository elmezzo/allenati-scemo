  const grpOf=e=>e.mu?muLbl(e.mu):e.t==="perf"?"Salti e lanci":e.t==="prev"?"Prevenzione":"Altro",mus=[...new Set(L.map(grpOf))];
  openSheet({html:()=>`<h2>Seduta libera</h2><p class="note" style="margin:0">Scegli gli esercizi nell'ordine in cui li fai. Vale solo per oggi; carichi e progressi sono quelli di sempre.</p>
    ${mus.map(m=>{const xs=L.filter(e=>grpOf(e)===m);return xs.length?`<p class="grp">${esc(m)}</p><div class="opts">${xs.map(e=>`<button class="opt" data-fx="${e.id}" aria-pressed="${sel.includes(e.id)}"><b>${sel.includes(e.id)?(sel.indexOf(e.id)+1)+". ":""}${esc(e.n)}</b><span>${e.s} serie · ${e.lo===e.hi?e.lo:e.lo+"-"+e.hi} ${e.t==="time"?"s":"rip"}${e.side?" per lato":""}</span></button>`).join("")}</div>`:""}).join("")}
    <button class="btn hot fxgo" id="fxGo" ${sel.length?"":"disabled"}>${sel.length?`Inizia con ${sel.length} esercizi`:"Scegli almeno un esercizio"}</button>`,
   bind:(w,draw,close)=>{w.querySelectorAll("[data-fx]").forEach(b=>b.onclick=()=>{const id=b.dataset.fx,i=sel.indexOf(id);if(i<0)sel.push(id);else sel.splice(i,1);const y=w.querySelector(".sheet").scrollTop;draw();w.querySelector(".sheet").scrollTop=y});

// Il primo piano che usa un id (la scheda, poi i tuoi nell'ordine) lo tiene; negli altri l'esercizio prende un id nuovo e sedute, bozze, varianti scelte e versioni vecchie lo seguono.
// Lo storico resta in comune per nome (famIds) e ogni piano torna ad avere il suo range.
// Gli id in comune tra i piani della scheda (es. Extrarotazione ed Estensione del polso in Gambe e Venerdì) sono voluti: un piano della scheda, anche modificato, tiene i suoi.
// Anche i piani eliminati che restano solo in Piani vecchi vengono sistemati (le loro sedute non devono contare per l'originale). I fastidi segnati si copiano sull'id nuovo.
function fixDupIds(){const seen=new Set(),base=id=>String(id).split("~")[0],keys=[...new Set([...Object.keys(BUILTIN),...Object.keys(S.plans),...S.archive.map(v=>v.key)])];
  for(const k of keys){const P=S.plans[k]||BUILTIN[k]||null,mine=new Set(),own=new Set(BUILTIN[k]?BUILTIN[k].ex.map(e=>e.id):[]);if(P&&!Array.isArray(P.ex))continue;
    if(S.plans[k]||!P){const map={},vers=[...(P?[P]:[]),...S.archive.filter(v=>v.key===k).map(v=>v.plan)];
      for(const V of vers)for(const e of V.ex){if(!e||!e.id)continue;const id=e.id;if(map[id]===undefined)map[id]=(seen.has(id)||seen.has(base(id)))&&!own.has(id)&&!own.has(base(id))?k+"_"+Math.random().toString(36).slice(2,7):null}
      for(const id in map)if(!map[id])delete map[id];
      if(Object.keys(map).length){const rn=id=>{if(map[id])return map[id];const i=String(id).indexOf("~");return i>0&&map[id.slice(0,i)]?map[id.slice(0,i)]+id.slice(i):id};
        const rk=o=>{if(!o||typeof o!=="object"||Array.isArray(o))return o;const n={};for(const x in o)n[rn(x)]=o[x];return n};
        for(const V of vers)for(const e of V.ex)if(e&&map[e.id]){e.lib=e.lib||e.id;e.id=map[e.id]}
        for(const s of S.sessions)if(s.day===k)for(const f of ["sets","names","eff","stn","pre"])if(s[f])s[f]=rk(s[f]);
        const fixD=d=>{for(const f in d){const v=d[f];if(typeof v==="string"&&f!=="date"&&f!=="g")d[f]=rn(v);else if(f!=="mods"&&f!=="nextNote")d[f]=rk(v)}if(d.nextNote&&d.nextNote.ex)d.nextNote.ex=rn(d.nextNote.ex)};
        if(S.draft[k])fixD(S.draft[k]);for(const o in S.oldDraft)if((S.oldDraft[o].g||o.split("@")[0])===k)fixD(S.oldDraft[o]);
        for(const w in S.swaps)if(w.startsWith(k+"|")){const n=k+"|"+rn(w.slice(k.length+1));if(n!==w){S.swaps[n]=S.swaps[w];delete S.swaps[w]}}
        // Fastidi: sono per id e non si sa su quale dei due piani erano stati segnati, quindi restano sull'originale e si copiano sulla copia
        for(const id in map)if(Array.isArray(S.pain[id])&&!S.pain[map[id]])S.pain[map[id]]=S.pain[id].slice();
        if(S.timer&&S.timer.ctx&&S.timer.ctx.g===k&&S.timer.ctx.ex)S.timer.ctx.ex=rn(S.timer.ctx.ex);fixDupIds.n=(fixDupIds.n||0)+1}}
    if(P)for(const e of P.ex)if(e&&e.id)mine.add(e.id);mine.forEach(i=>seen.add(i))}}

/* ================= TODAY ENGINE =================
   Regole: gambe ≥48 h prima di una partita; niente gambe nei giorni di padel;
   padel prima della palestra e una serie in meno sulle spinte sopra la testa;
   giorno di partita o energia bassa = una serie in meno su tutto; partita domani = RIR +1. */
function nextLegSlot(from){
  for(let i=1;i<=7;i++){const d=addDays(from,i),p=dayPlan(d),p1=dayPlan(addDays(d,1));
    if(p.padel==="none"&&p1.padel!=="match")return d}
  return null;
}
function assess(d){
  const p=dayPlan(d),t1=dayPlan(addDays(d,1)),t2=dayPlan(addDays(d,2)),energy=S.energy[iso(d)]||"ok";
  const r={level:"go",title:"",notes:[],mods:new Set(),gym:p.gym,padel:p.padel,energy};
  const say=(lvl,msg)=>{const order={go:0,adapt:1,stop:2};if(order[lvl]>order[r.level])r.level=lvl;r.notes.push(msg)};
  if(PLAN[p.gym]?.legs){
    if(p.padel!=="none"){
      const alt=nextLegSlot(d);
      say("stop",`Gambe e ${p.padel==="match"?"partita":"padel"} nello stesso giorno: le gambe ${alt?`spostale a ${WD_LONG[alt.getDay()]} ${alt.getDate()}`:"spostale a un giorno senza padel"}.`);
      if(PLAN.C){r.notes.push("Se vuoi comunque allenarti oggi, fai l'Upper C.");r.gymAlt="C"}
    }else if(t1.padel==="match"){
      const alt=nextLegSlot(addDays(d,1));
      say("stop",`Partita domani: niente gambe oggi. ${alt?`Spostale a ${WD_LONG[alt.getDay()]} ${alt.getDate()}.`:""}`);
      if(PLAN.C){r.notes.push("Oggi puoi fare l'Upper C o riposare.");r.gymAlt="C"}
    }else if(t2.padel==="match"){
      say("adapt","Partita dopodomani: gambe sì, ma senza Nordic e con una serie in meno sugli esercizi eccentrici pesanti (es. stacco rumeno).");r.mods.add("noEcc");
    }else if(t1.padel==="train"&&earlyPhase(d)){
      say("adapt","Domani padel, e sei nelle prime 3 settimane: una serie in meno sugli esercizi eccentrici pesanti (stacco rumeno, Nordic) per arrivare in campo meno indolenzito.");r.mods.add("noEccLight");
    }else if(t1.padel==="train"){
      say("go","Domani padel: seduta completa.");
    }else say("go","Giornata libera da padel e nessuna partita nelle prossime 48 h: seduta completa.");
  }else if(p.gym in PLAN){
    if(p.padel==="match"){say("adapt","Giorno di partita: palestra dopo la partita e solo se ti senti fresco. Una serie in meno su tutto.");r.mods.add("light")}
    else if(p.padel==="train"){
      // Esercizi di oggi con le varianti scambiate (es. landmine al posto della panca Smith): anche loro tolgono la serie sulle spinte sopra la testa
      const oh=PLAN[p.gym].ex.some(e=>effEx(p.gym,e).oh),pv=PLAN[p.gym].ex.some(e=>e.t==="prev");
      if((S.order||"gym")==="gym"){say("adapt",`Palestra prima del padel: almeno 1 ripetizione in canna anche sull'isolamento${oh?", una serie in meno sulle spinte sopra la testa":""}${pv?". La prevenzione (cuffia, polso) falla dopo il padel":""}.`);r.mods.add("prePadel");if(oh)r.mods.add("oh")}
      else{say(oh?"adapt":"go",`Padel prima, palestra dopo${oh?". Una serie in meno sulle spinte sopra la testa":""}.`);if(oh)r.mods.add("oh")}
    }else say("go","Niente padel oggi: seduta completa.");
    // Prima di due partite (domani e dopodomani), anche con padel o partita oggi: di base seduta completa senza cedimento.
    // La versione ridotta (braccia, Copenhagen, core, cuffia e polso) è a un tocco e resta scelta finché non la cambi (S.preMatchLite)
    if(t1.padel==="match"&&t2.padel==="match"){r.notes=r.notes.filter(n=>!/seduta completa/.test(n));r.pm=true;

const PAIRS=[["petto","dorso"],["quadricipiti","femorali"],["tricipiti","bicipiti"]];
function balanceAt(at){
  const A=rankAll(null,at),out=[];if(!A.BW)return out;
  for(const [a,b] of PAIRS){const x=A.mus[a],y=A.mus[b];if(!x||!y||x.none||y.none)continue;
    const d=x.v-y.v;if(Math.abs(d)>=2)out.push({kind:"rank",lo:d>0?y:x,hi:d>0?x:y,d:Math.abs(d)})}
  const end=addDays(at||today(),1),v=volRange(addDays(end,-14),end),push=v.petto,pull=v.dorso;
  if(push+pull>=12&&(pull<push*2/3||push<pull*2/3))out.push({kind:"vol",push,pull});
  return out;
}

function buildReview(c){
  if(!c)return null;const from=new Date(c.from+"T00:00:00"),to=new Date(c.to+"T00:00:00");
  const ss=S.sessions.filter(s=>!s.deload&&dayOf(s)>=c.from&&dayOf(s)<c.to).sort((a,b)=>a.date.localeCompare(b.date));
  if(ss.length<3)return null;
  const wk=Math.max(1,(to-from)/(7*864e5));
  const grp={};for(const s of ss)for(const id in s.sets){const k=String(exName(id)).trim().toLowerCase();(grp[k]=grp[k]||new Set()).add(id)}
  const ex=[];for(const k in grp){const ids=[...grp[k]],e=exById(ids[0]);if(["perf","prev","time"].includes(e.t))continue;const ns=noStall(e);
    // Stesso nome in giorni diversi (es. alzate laterali in A e in C) = serie separate: si valuta ogni esercizio per conto suo
    const ph=phaseAt(c.to),chs=[],sts=[];let n0=0;
    for(const id of ids){const pr=ss.filter(s=>s.sets[id]).map(s=>[Math.max(0,...s.sets[id].map(x=>metricOf(e,x))),Math.max(0,...s.sets[id].map(x=>num(x.kg)||0))]).filter(v=>v[0]>0);
      n0+=pr.length;if(pr.length<2)continue;const hs=pr.map(v=>v[0]);chs.push((hs[hs.length-1]-hs[0])/hs[0]);
      // Stessa regola della scheda: le ultime 3 sedute non battono il meglio di quelle prima (Nordic mai fermo)
      if(pr.length>=4&&!ns){const W=pr.slice(-3),P=pr.slice(0,-3),pk=Math.max(...P.map(v=>v[1])),pb=Math.max(...P.map(v=>v[0]));sts.push(ph==="def"?stallBy(ph,hs.slice(-4).reverse()):!W.some(v=>v[1]>pk+1e-9||v[0]>pb+1e-9))}}
    if(!chs.length)continue;
    const ch=chs.reduce((a,b)=>a+b,0)/chs.length,st=sts.length>0&&sts.every(Boolean);
    ex.push({n:exName(ids[0]),ch,st,t:e.t,n0})}
  const vr=volRange(from,to),vol=RMU.map(([k,n])=>({k,n,v:vr[k]/wk}));
  const eff={comp:{easy:0,ok:0,hard:0},iso:{easy:0,ok:0,hard:0}};
  for(const s of ss)for(const id in (s.eff||{})){const e=exById(id),g=e.t==="comp"?"comp":e.t==="iso"?"iso":null,v=s.eff[id];if(g&&eff[g][v]!=null)eff[g][v]++}
  const W=S.body.filter(x=>x.kg!=null&&x.d>=c.from&&x.d<=c.to).sort((a,b)=>a.d.localeCompare(b.d));
  let bw=null;if(W.length>=2){const a=W[0],b=W[W.length-1],w=Math.max(1,(new Date(b.d)-new Date(a.d))/(7*864e5));if(w>=2)bw={a:a.kg,b:b.kg,w,pct:(b.kg-a.kg)/a.kg/w*100}}
  return {c,n:ss.length,wk,ex,vol,eff,bw,ph:phaseAt(addDays(to,-1)),bal:balanceAt(addDays(to,-1))};
}

function legRule(d){

  const n1=S.week[(d+1)%7]||{},n2=S.week[(d+2)%7]||{};
  if(!PLAN[p.gym].legs)return n1.padel==="match"&&n2.padel==="match"&&(p.padel||"none")==="none"?`<span class="rule mid">${I("warn")}Partite nei 2 giorni dopo: solo braccia e prevenzione</span>`:"";
  if(p.padel!=="none"&&p.padel)return `<span class="rule bad">✕ Stesso giorno del padel</span>`;
  if(n1.padel==="match")return `<span class="rule bad">✕ Partita il giorno dopo</span>`;

}

   <div class="vars" role="group" aria-label="Colore dello stile"><span>Colore: ${SKVARS[S.skin||"vetro"][(S.vars||{})[S.skin||"vetro"]||0][0]}</span>${SKVARS[S.skin||"vetro"].map(([l,g],i)=>`<button data-var="${i}" aria-label="${l}" aria-pressed="${((S.vars||{})[S.skin||"vetro"]||0)===i}" style="background:${g}"></button>`).join("")}</div>${(S.skin||"vetro")==="vetro"?`<div class="q"><span class="lab">Giorno e sera</span><div class="seg" id="segSera">${[["auto","Automatico"],["giorno","Giorno"],["sera","Sera"]].map(([v,l])=>`<button data-sera="${v}" aria-pressed="${(S.sera||"auto")===v}">${l}</button>`).join("")}</div><p class="note" style="margin:0">Automatico: chiaro di giorno, scuro dalle 19 alle 7.</p></div>`:""}</section>
  <section class="card"><h3>Regole che l'app applica</h3>
   <ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px">
    <li>Ripetizioni prima, carico poi: +1 ripetizione per serie finché chiudi tutto al limite alto del range, poi aumenta il carico e riparti dal basso. L'aumento segue l'attrezzo: +5 kg macchine e stazione cavi (pacco pesi), +2,5 kg cavo singolo (alzate, extrarotazione, pulley), bilanciere e Smith, +2 kg manubri e zavorra con kettlebell. Sui multiarticolari della parte alta, se il 2,5% del carico è più del gradino, sale di quello, arrotondato al gradino. Gambe: sempre un gradino (+2,5 kg col bilanciere).</li>
    <li>Dopo l'ultima serie puoi dire com'era. Facile: due ripetizioni in più invece di una; a fine range sui multiarticolari e sulle trazioni aumento doppio, se resta entro il 10% del carico (per le trazioni conta anche il tuo peso). Al limite su un multiarticolare (trazioni comprese) a fine range: il carico resta fermo finché non chiudi con le ripetizioni in canna previste.</li>
    <li>Isolamento della parte alta a macchina o al cavo con un gradino grosso (oltre il 15%) o a pacco finito: ultima serie in myo-rep, mini-serie da 5 con 15 s di pausa; con 4 mini-serie complete sali di peso. Mai nei giorni con padel dopo, partita domani, scarico, Stanco o in superserie: lì serie normali con il range esteso fino a 5 ripetizioni oltre, come sotto. Con la tua settimana (padel lunedì e mercoledì, partite nel weekend) i myo-rep restano quasi sempre spenti.</li>
    <li>Isolamento e prevenzione con un gradino grosso rispetto al carico (oltre il 15%, oltre il 10% se il range è fisso come il reverse fly 2×15; es. extrarotazione al cavo da 5 a 7,5 kg, +50%), e cavi e macchine nei giorni senza myo-rep: prima porti le ripetizioni fino a 5 oltre il range, poi sali di peso. Se anche così il salto è troppo grosso, resti al carico con la discesa in 3 secondi e una ripetizione in più ogni volta, fino a 10 oltre il range: quello è il carico di mantenimento. Con un salto oltre il 25% l'app ti propone subito la variante dove il peso sale a passi più piccoli (⇄ Cambia).</li>
    <li>Pacco finito (pulley sul cavo singolo a 50 kg, Selection 700): si sale con le ripetizioni, fino a 5 oltre il range sui multiarticolari e 10 sull'isolamento, poi stesso carico con discesa in 3 secondi e 1 secondo fermo; per più carico ⇄ Cambia. Se l'ultima volta hai segnato più del pacco, riparti dal pacco.</li>
    <li>Una serie sotto il minimo: la volta dopo quella serie punta al minimo, le altre restano come l'ultima volta. Una serie che mancava (seduta con una serie in meno) riparte dall'ultima fatta.</li>
    <li>Due sedute di fila allo stesso carico con almeno 2 ripetizioni sotto il minimo in tutto, ripetizioni medie non salite, ultima serie non Facile e niente giorno Stanco o partita: -10% e riparti dalle ripetizioni che facevi a quel carico. Nelle prime 3 sedute dopo un aumento stare 1-2 ripetizioni sotto il minimo non conta. Se il -10% vuol dire scendere più del 15% (gradino grosso), carico fermo e una ripetizione in più per serie. Con la zavorra conta anche il tuo peso.</li>
    <li>Esercizio fermo (nelle ultime 3 sedute non hai battuto il meglio delle sedute prima: né i kg, né il massimale stimato, né le ripetizioni totali al carico più alto): prova una variante o togli una serie per due settimane. Lo scarico non azzera il conto; le sedute da Stanco o di partita non contano, e dopo un calo di carico (chiesto dall'app o scelto da te) conta solo il meglio da lì in poi: è ricostruzione, non stallo. Prevenzione (polso, cuffia, Pallof, woodchop), salti, tenute e Nordic non contano mai come fermi né per lo scarico.</li>
    <li>Woodchop: ripetizioni fisse ed esplosive; il carico sale quando tutte le serie sono state veloci (non "Al limite") e il gradino non supera il 20%, altrimenti stesso carico più veloce. Multiarticolari a ripetizioni fisse con un gradino oltre il 10% (bulgarian 8 con +2 kg): prima 2 ripetizioni in più, poi il carico. Salti: ripetizioni fisse, si progredisce in altezza o distanza. Nordic: meno aiuto dall'elastico quando chiudi il range; con 2 o più serie sotto il minimo, elastico più forte. Pallof: ripetizioni fisse, il carico sale quando l'ultima serie è Facile e il gradino non supera il 25%. Copenhagen (caviglia sulla panca, gamba tesa): +5 s fino a 30, poi fino a 40, poi alzi e abbassi piano la gamba sotto; con la leva corta (ginocchio) a 30 s torni alla caviglia.</li>
    <li>Gambe mai nello stesso giorno del padel e mai il giorno prima di una partita. Partita dopo 2 giorni: niente Nordic e una serie in meno sugli eccentrici.</li>
    <li>Partita domani: almeno 1 ripetizione in canna su tutto (dove la scheda dice 0 diventa 1). Palestra prima del padel: almeno 1 in canna anche sull'isolamento.</li>
    <li>Una serie molto sotto il range (3 o più ripetizioni sotto il minimo): le serie dopo, in quella seduta, scendono del 10%. La volta dopo si riparte dal carico con cui hai fatto la maggior parte delle serie, con le ripetizioni fatte lì.</li>
    <li>Venerdì prima di due partite (sabato e domenica), anche con padel o partita il venerdì: di base seduta completa senza serie a cedimento (almeno 1 in canna). Con un tocco su Oggi passi alla versione ridotta (solo braccia, Copenhagen, core, cuffia e polso), che resta finché non torni alla completa.</li>
    <li>Padel e palestra nello stesso giorno: una serie in meno sulle spinte sopra la testa. Giorno di partita o Stanco: una serie in meno su tutto, stessi carichi e stesse ripetizioni dell'ultima volta in quel range (le alzate al cavo del lunedì e del venerdì vanno ognuna per conto suo). Se quel giorno vai peggio della seduta normale prima, la volta dopo si riparte dalla seduta normale.</li>
    <li>Scarico quando serve, non a calendario: l'app lo propone dopo 6 settimane senza scarico (la scheda dice ogni 5-6: puoi avviarlo prima a mano) o con 3+ esercizi fermi, ma non prima di 4 settimane di lavoro. Le prime 2 sedute di un esercizio (in quel range) servono a trovare il carico e non contano per lo stallo. Serie dimezzate, stessi carichi dell'ultima seduta vera (o quello già abbassato, se l'app ti aveva chiesto di scendere), 3-4 in canna. Le sedute di scarico non contano per la progressione. Una pausa di 7 o più giorni senza sedute vale come scarico.</li>
    <li>Pausa lunga su un esercizio: dopo 14 o più giorni senza farlo, la prima volta ripeti l'ultima seduta (stessi kg e ripetizioni); dopo 28 o più giorni, 10% in meno sui kg, arrotondato al gradino (con la zavorra conta anche il tuo peso). Se il gradino è troppo grosso per scendere del 10% (es. 30 kg al cavo col gradino da 5) o sei a corpo libero, carico uguale e 3 ripetizioni in meno, mai sotto il minimo del range. Dalla volta dopo si riprende a salire.</li>
    <li>Serie di avvicinamento «A» sul primo esercizio di petto, sul primo di dorso e sul primo multiarticolare: carichi a circa 50, 70 e 85% di quello di lavoro, 60 s di pausa.</li>
    <li>Timbro PR: quando una serie supera il massimale stimato migliore di almeno il 2% e in più usa un carico mai usato prima o batte il massimale della proposta di oggi, anche con più ripetizioni a un carico più basso (seguire la progressione da sola non basta). Niente timbro su Pallof, woodchop, salti, tenute e Nordic. Per trazioni e dip il massimale conta il tuo peso più la zavorra.</li>
   </ul></section>

    if(E.key&&PLAN[key])archivePlan(key,"modificato");
    const B=BUILTIN[key];
    S.plans[key]={name,title:B&&B.name===name?B.title:name,sub:(E.sub||"").trim()||`${out.length} esercizi`,legs:!!E.legs,custom:!B,ex:out};
    rebuild();save();editPlan=null;go("imp");
    const wm=document.getElementById("wmsg");if(wm){wm.className="msg ok";wm.textContent=`Piano "${name}" salvato. Assegnalo a un giorno in Settimana o sceglilo in Allenamento.`}
  };
}

/* ================= DEMO ================= */
// Dati di esempio: non si mescolano mai alle sedute vere
function clearDemo(){S.sessions=S.sessions.filter(x=>!x.demo);S.body=S.body.filter(x=>!x.demo)}
function loadDemo(){
  const now=today(),out=[];
  for(let w=7;w>=1;w--){
    for(const [g,off] of [["A",0],["G",1],["B",2],["C",4]]){
      const d=addDays(now,-(w*7)+off-((now.getDay()+6)%7));if(d>=now)continue;
      const sets={};
      for(const ex of PLAN[g].ex){
        const base={a1:50,a2:0,a3:40,a4:45,a5:7.5,a6:10,a7:15,a8:5,g3:70,g4:60,g5:14,g8:40,g9:15,b1:16,b10:15,b2:50,b3:7.5,b4:45,b5:8,b6:20,b7:10,b8:20,b9:6,c1:40,c2:20,c3:5,c4:30,c5:7.5,c6:17.5,c7:15}[ex.id];
        const prog=(7-w);const kg=base!=null?base+Math.floor(prog/2)*(ex.step||2.5):null;
        const reps=Math.min(ex.hi,ex.lo+(prog%2)+(prog%3===0?1:0));
        sets[ex.id]=[...Array(ex.s)].map(()=>({kg:kg!=null&&!["perf","nordic","time"].includes(ex.t)?String(kg):"",reps:String(ex.t==="time"?Math.min(30,20+prog*2):reps)}));
      }
      out.push({id:"demo"+w+g,day:g,date:d.toISOString(),sets,demo:true});
    }
  }
  S.sessions=out;if(!S.body.some(x=>num(x.kg)>0))S.body.push({d:iso(today()),kg:70,demo:true});save();
}
